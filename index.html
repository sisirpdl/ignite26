        // Second group: you + Anshu + five other runners. Demo data for that group's profile and stories.

        };

        // ---------- Maps ----------
        const MAP_W = 360, MAP_H = 300, KM_PER_PX = 0.02, RUN_TICKS = 60;
        const polyLen = (pts) => pts.slice(1).reduce((sum, p, i) => sum + Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1]), 0);
        const pointAt = (pts, t) => {
            let d = clamp(t, 0, 1) * polyLen(pts);
            for (let i = 1; i < pts.length; i++) {
                const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
                const len = Math.hypot(x1 - x0, y1 - y0);
                if (d <= len) { const f = len ? d / len : 0; return [x0 + (x1 - x0) * f, y0 + (y1 - y0) * f]; }
                d -= len;
            }
            return pts[pts.length - 1];
        };
        const partialPts = (pts, t) => {
            let d = clamp(t, 0, 1) * polyLen(pts);
            const out = [pts[0]];
            for (let i = 1; i < pts.length; i++) {
                const len = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
                if (d <= len) { out.push(pointAt([pts[i - 1], pts[i]], len ? d / len : 0)); return out; }
                out.push(pts[i]); d -= len;
            }
            return out;
        };
        const toPath = (pts) => 'M' + pts.map(p => p.join(',')).join(' L');
        const fmtClock = (sec) => {

        const fmtPace = (secPerKm) => { const t = Math.round(secPerKm); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}/km`; };

        const ROUTES_INIT = [

        ];
        // Hex territory: the game world is a 360x300 "px" plane (1 px = 20 m) projected onto a real map.
        const M_PER_PX = 20;
        const DEFAULT_CENTER = [44.0132, -97.1112]; // Dakota State University, Madison SD; "Use my location" re-centres the world
        const HEX = 14;
        const hexCenter = (q, r) => [HEX * Math.sqrt(3) * (q + r / 2), HEX * 1.5 * r];
        const hexCorners = (q, r) => {
            const [cx, cy] = hexCenter(q, r);
            return Array.from({ length: 6 }, (_, i) => { const a = (Math.PI / 180) * (60 * i - 30); return [cx + HEX * Math.cos(a), cy + HEX * Math.sin(a)]; });
        };
        const pxToHexId = (x, y) => {
            const q = ((Math.sqrt(3) / 3) * x - y / 3) / HEX, r = ((2 / 3) * y) / HEX;
            let rx = Math.round(q), rz = Math.round(r);
            const ry = Math.round(-q - r);
            const dx = Math.abs(rx - q), dz = Math.abs(rz - r), dy = Math.abs(ry + q + r);
            if (dx > dy && dx > dz) rx = -ry - rz; else if (dz > dy) rz = -rx - ry;
            return `${rx},${rz}`;
        };
        const HEX_GRID = (() => {
            const out = [];
            for (let r = -1; r <= Math.ceil(MAP_H / (1.5 * HEX)) + 1; r++) {
                for (let q = -Math.ceil(r / 2) - 2; q <= Math.ceil(MAP_W / (Math.sqrt(3) * HEX)) + 2; q++) {
                    const [cx, cy] = hexCenter(q, r);
                    if (cx > -HEX / 2 && cx < MAP_W + HEX / 2 && cy > -HEX / 2 && cy < MAP_H + HEX / 2) out.push({ id: `${q},${r}`, q, r, cx, cy });
                }
            }
            return out;
        })();
        const TURF_SEEDS = { 1: [205, 245], 2: [292, 195], 3: [95, 105], 4: [192, 72] };
        const HEXES_INIT = Object.fromEntries(HEX_GRID.map(h => {
            let best = null, bd = 62;
            Object.entries(TURF_SEEDS).forEach(([id, [x, y]]) => { const d = Math.hypot(h.cx - x, h.cy - y); if (d < bd) { bd = d; best = Number(id); } });
            return [h.id, best];
        }));
        const toLatLng = (c, [x, y]) => [
            c[0] - ((y - MAP_H / 2) * M_PER_PX) / 111320,
            c[1] + ((x - MAP_W / 2) * M_PER_PX) / (111320 * Math.cos((c[0] * Math.PI) / 180)),
        ];
        const toPx = (c, lat, lng) => [
            MAP_W / 2 + ((lng - c[1]) * 111320 * Math.cos((c[0] * Math.PI) / 180)) / M_PER_PX,
            MAP_H / 2 - ((lat - c[0]) * 111320) / M_PER_PX,

        const LIVE_INIT = {

        // ---------- Small components ----------
        function Ring({ value, max = 100, size = 168, stroke = 12, color = '#22d3ee', track = '#0f172a', children }) {

        function Avatar({ m, size = 36 }) {

        function Source() { return null; }

        // Real map via Leaflet (global `L`), driven imperatively from React props.
        const pinHtml = (p) => `<div class="sq-pin ${p.moving ? 'moving' : ''} ${p.ghost ? 'ghost' : ''} ${p.hidden ? 'hidden-me' : ''}" style="--c:${p.color}"><img src="${p.img}" alt="" draggable="false"/>${p.ghost ? '<b>👻</b>' : ''}${p.label ? `<i>${p.label}</i>` : ''}</div>`;

        function SquadMap({ center, hexes, routes, run, trails, rally, colors, pins, mode, highlight, follow, focus, onMapClick }) {
            const elRef = useRef(null);
            const R = useRef({});
            const clickRef = useRef(onMapClick);
            clickRef.current = onMapClick;

            useEffect(() => {
                if (!window.L || !elRef.current) return;
                const Lf = window.L;
                const m = Lf.map(elRef.current, { zoomControl: false, maxZoom: 16 }).setView(toLatLng(center, [MAP_W / 2, MAP_H / 2]), 15);
                // Esri Dark Gray Canvas: free basemap tiles, no API key needed.
                const esri = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/';
                Lf.tileLayer(esri + 'World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16, attribution: 'Tiles &copy; Esri, HERE, Garmin, &copy; OpenStreetMap contributors' }).addTo(m);
                Lf.tileLayer(esri + 'World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16, opacity: 0.8 }).addTo(m);
                R.current = { map: m, hexes: {}, styled: {}, markers: {}, hexLayer: Lf.layerGroup().addTo(m), lineLayer: Lf.layerGroup().addTo(m) };
                m.on('click', (e) => clickRef.current && clickRef.current(e.latlng));
                setTimeout(() => m.invalidateSize(), 60);
                return () => { m.remove(); R.current = {}; };
            }, []);

            // (Re)build the hex grid whenever the world is re-centred.
            useEffect(() => {
                const r = R.current; if (!r.map) return;
                r.map.setView(toLatLng(center, [MAP_W / 2, MAP_H / 2]), r.map.getZoom());
                r.hexLayer.clearLayers(); r.hexes = {}; r.styled = {};
                HEX_GRID.forEach(h => { r.hexes[h.id] = window.L.polygon(hexCorners(h.q, h.r).map(pt => toLatLng(center, pt)), { interactive: false }).addTo(r.hexLayer); });
                if (r.landmark) { r.landmark.remove(); r.landmark = null; }
                if (center[0] === DEFAULT_CENTER[0] && center[1] === DEFAULT_CENTER[1]) {
                    r.landmark = window.L.marker(DEFAULT_CENTER, { interactive: false, zIndexOffset: -100, icon: window.L.divIcon({ className: '', html: '<div class="campus-pin">🎓 Dakota State University</div>', iconSize: [0, 0] }) }).addTo(r.map);
                }
            }, [center[0], center[1]]);

            // Paint hexes (only the ones whose owner or mode changed).
            useEffect(() => {
                const r = R.current; if (!r.map) return;
                HEX_GRID.forEach(h => {
                    const o = hexes[h.id], key = `${o}|${mode}`;
                    if (r.styled[h.id] === key) return;
                    r.styled[h.id] = key;
                    const c = o ? colors[o] : null;
                    r.hexes[h.id].setStyle(c
                        ? { color: c, weight: o === ME ? 1.6 : 0.8, opacity: 0.75, fillColor: c, fillOpacity: mode === 'territory' ? 0.42 : 0.16 }
                        : { color: '#334155', weight: 0.5, opacity: 0.35, fillOpacity: 0.02 });
                });
            });

            // Routes, run progress, trails, rally point and squad pins.
            useEffect(() => {
                const r = R.current; if (!r.map) return;
                const Lf = window.L;
                r.lineLayer.clearLayers();
                routes.forEach(rt => {
                    const sel = rt.id === highlight;
                    Lf.polyline(rt.pts.map(pt => toLatLng(center, pt)), { color: sel ? '#c8ff00' : '#94a3b8', weight: sel ? 5 : 2, opacity: sel ? 0.95 : 0.35, dashArray: sel ? null : '4 6', interactive: false }).addTo(r.lineLayer);
                });
                if (run) {
                    const rt = routes.find(x => x.id === run.routeId);
                    Lf.polyline(partialPts(rt.pts, run.t).map(pt => toLatLng(center, pt)), { color: '#ffffff', weight: 6, opacity: 0.9, interactive: false }).addTo(r.lineLayer);
                }
                Object.entries(trails).forEach(([id, pts]) => {
                    if (pts.length > 1) Lf.polyline(pts.map(pt => toLatLng(center, pt)), { color: colors[id], weight: 3, opacity: 0.55, interactive: false }).addTo(r.lineLayer);
                });
                if (rally) {
                    Lf.marker(toLatLng(center, [rally.x, rally.y]), { interactive: false, icon: Lf.divIcon({ className: '', html: `<div class="rally-pin">📍<span>${rally.label}</span></div>`, iconSize: [30, 30], iconAnchor: [15, 28] }) }).addTo(r.lineLayer);
                }
                const keep = new Set();
                pins.forEach(p => {
                    keep.add(p.key);
                    const ll = toLatLng(center, [p.x, p.y]), html = pinHtml(p);
                    const icon = () => Lf.divIcon({ className: 'squad-marker', html, iconSize: [38, 38], iconAnchor: [19, 19] });
                    let mk = r.markers[p.key];
                    if (!mk) { mk = Lf.marker(ll, { icon: icon(), zIndexOffset: p.me ? 1000 : p.ghost ? 500 : 0, interactive: false }).addTo(r.map); mk._html = html; r.markers[p.key] = mk; }
                    else { mk.setLatLng(ll); if (mk._html !== html) { mk.setIcon(icon()); mk._html = html; } }
                });
                Object.keys(r.markers).forEach(k => { if (!keep.has(k)) { r.markers[k].remove(); delete r.markers[k]; } });
            });

            // Camera: follow the runner, or fly to a requested focus point.
            const followKey = follow ? follow.map(v => Math.round(v)).join(',') : '';
            useEffect(() => { const r = R.current; if (r.map && follow) r.map.panTo(toLatLng(center, follow), { animate: true, duration: 0.9 }); }, [followKey]);
            useEffect(() => { const r = R.current; if (r.map && focus) r.map.flyTo(toLatLng(center, [focus.x, focus.y]), focus.zoom || 15, { duration: 0.8 }); }, [focus && focus.key]);

            return <div ref={elRef} className="absolute inset-0" />;
        }

        function Card({ label, right, children, className = '' }) {

        function MonthlyChallengeChart({ players, pointLabel, labelForIndex, maxPossible }) {
            const currentDay = players[0]?.chartEntries.length || 0;
            const boxRef = useRef(null);
            const [box, setBox] = useState({ w: 460, h: 400 });
            useEffect(() => {
                const el = boxRef.current; if (!el) return;
                const measure = () => { const r = el.getBoundingClientRect(); if (r.width && r.height) setBox({ w: r.width, h: r.height }); };
                measure();
                const ro = new ResizeObserver(measure); ro.observe(el);
                return () => ro.disconnect();
            }, []);
            const width = 460, height = Math.max(360, Math.round((460 * box.h) / box.w));
            const pad = { top: 42, right: 58, bottom: 60, left: 64 };
            const plotW = width - pad.left - pad.right;
            const plotH = height - pad.top - pad.bottom;
            const visibleScores = players.flatMap(player => {
                let cumulative = player.baseScore || 0;
                return [cumulative, ...player.chartEntries.map(score => (cumulative += score))];
            });
            const scoreFloorValue = Math.min(...visibleScores);
            const scoreCeilingValue = Math.max(...visibleScores);
            // Full views: 0 up to the maximum possible so far (e.g. day 19 → 1,900 → axis to 2,000).
            // 12H view: fit tightly around the squad's scores so the lines fill the chart.
            const fitStep = [50, 100, 200, 250, 500, 1000].find(st => st >= (scoreCeilingValue - scoreFloorValue) / 4) || 1000;
            const tickStep = maxPossible ? ([100, 200, 250, 500, 1000, 2000, 2500, 5000].find(st => st >= maxPossible / 4) || 5000) : fitStep;
            const scoreFloor = maxPossible ? 0 : Math.max(0, Math.floor(scoreFloorValue / tickStep) * tickStep);
            const scoreCeiling = maxPossible
                ? Math.ceil(maxPossible / tickStep) * tickStep
                : Math.max(scoreFloor + tickStep, Math.ceil(scoreCeilingValue / tickStep) * tickStep);
            const yTicks = Array.from({ length: Math.round((scoreCeiling - scoreFloor) / tickStep) + 1 }, (_, i) => scoreFloor + i * tickStep);
            const x = (index) => currentDay === 1
                ? pad.left + plotW / 2
                : pad.left + (index / (currentDay - 1)) * plotW;
            const axisProgress = (score) => (scoreCeiling === scoreFloor ? 0.5 : (clamp(score, scoreFloor, scoreCeiling) - scoreFloor) / (scoreCeiling - scoreFloor));
            const y = (score) => pad.top + plotH - axisProgress(score) * plotH;
            const formatScore = (score) => score >= 1000 ? `${(score / 1000).toFixed(1)}k` : `${Math.round(score)}`;
            const dayLabels = currentDay <= 4
                ? Array.from({ length: currentDay }, (_, index) => index)
                : [0, Math.round((currentDay - 1) / 3), Math.round((currentDay - 1) * 2 / 3), currentDay - 1];
            const smoothPath = (points) => points.reduce((path, point, index) => {
                if (index === 0) return `M ${point.x} ${point.y}`;
                const previous = points[index - 1];
                const controlX = (previous.x + point.x) / 2;
                return `${path} C ${controlX} ${previous.y}, ${controlX} ${point.y}, ${point.x} ${point.y}`;
            }, '');
            const series = players.map(player => {
                let cumulative = player.baseScore || 0;
                const points = player.chartEntries.map((score, index) => {
                    cumulative += score;
                    return { x: x(index), y: y(cumulative), score, total: cumulative };
                });
                const line = smoothPath(points);
                const first = points[0];
                const last = points[points.length - 1];
                return { player, points, line, first, last, area: `${line} L ${last.x} ${pad.top + plotH} L ${first.x} ${pad.top + plotH} Z` };
            });
            const endpointLayouts = new Map();
            [...series].sort((a, b) => b.last.total - a.last.total).forEach(({ player, last }) => {
                let avatarX = last.x, avatarY = last.y, attempt = 0;
                const overlaps = () => [...endpointLayouts.values()].some(other => Math.hypot(avatarX - other.avatarX, avatarY - other.avatarY) < 42);
                while (overlaps() && attempt < 4) {
                    const lane = Math.ceil((attempt + 1) / 2);
                    const direction = attempt % 2 === 0 ? -1 : 1;
                    avatarX = last.x - lane * 30;
                    avatarY = clamp(last.y + direction * lane * 30, pad.top + 19, pad.top + plotH - 19);
                    attempt += 1;
                }
                endpointLayouts.set(player.id, { avatarX, avatarY });
            });
            // Small translucent tags left of each player's latest point: why today's score moved.
            const placedTags = [];
            const tagLayouts = series.flatMap(({ player, last }) => {
                const { avatarX } = endpointLayouts.get(player.id);
                const right = Math.min(avatarX, last.x) - 26;
                return (player.tags || []).map((tag, i) => {
                    const text = `${POINT_KINDS[tag.kind]} ${tag.v > 0 ? '+' : '−'}${Math.abs(tag.v)}`;
                    const w = 14 + text.length * 7.2, h = 20;
                    let ty = last.y - h / 2 - i * (h + 4);
                    for (let k = 0; k < 8 && placedTags.some(r => Math.abs(r.y - ty) < h + 2 && r.x < right && r.x + r.w > right - w); k++) ty -= h + 4;
                    ty = clamp(ty, pad.top, pad.top + plotH - h);
                    const rect = { x: right - w, y: ty, w, h };
                    placedTags.push(rect);
                    return { key: `${player.id}-${tag.kind}`, color: player.color, text, ...rect };
                });
            });

            return (
                <div ref={boxRef} className="w-full h-full min-h-[360px]">
                <svg className="block w-full h-full" viewBox={`0 0 ${width} ${height}`} role="img" aria-label={`Challenge Score chart across ${currentDay} ${pointLabel.toLowerCase()}s`}>
                        <defs>
                            <linearGradient id="chart-area" x1="0" x2="0" y1="0" y2="1">
                                <stop offset="0%" stopColor="#c8ff00" stopOpacity="0.2" />
                                <stop offset="100%" stopColor="#c8ff00" stopOpacity="0" />
                            </linearGradient>
                        </defs>
                        {yTicks.map((value, index) => {
                            const py = y(value);
                            return <g key={value}>
                                <line x1={pad.left} x2={width - pad.right} y1={py} y2={py} stroke="#1e293b" strokeDasharray={index === 0 ? '0' : '5 8'} />
                                <text x={pad.left - 10} y={py + 4} textAnchor="end" fill="#64748b" fontSize="16" fontWeight="700">{formatScore(value)}</text>
                            </g>;
                        })}
                        {dayLabels.map(index => <g key={index}>
                            <line x1={x(index)} x2={x(index)} y1={pad.top} y2={pad.top + plotH} stroke="#172033" strokeDasharray="4 8" />
                            <text x={x(index)} y={height - 23} textAnchor="middle" fill="#94a3b8" fontSize="18" fontWeight="700">{labelForIndex(index)}</text>
                        </g>)}
                        <text x={pad.left} y="15" fill="#64748b" fontSize="16" fontWeight="800" letterSpacing="2">CHALLENGE SCORE</text>
                        {series.map(({ player, points, line, last, area }) => {
                            const { avatarX, avatarY } = endpointLayouts.get(player.id);
                            return <g key={player.id}>
                                {player.id === ME && <path d={area} fill="url(#chart-area)" />}
                                <path d={line} fill="none" stroke={player.color} strokeWidth={player.id === ME ? 5 : 3.5} strokeLinecap="round" strokeLinejoin="round" opacity={player.id === ME ? 1 : 0.78} />
                                {points.map((point, index) => <g key={index}>
                                    {(index % 3 === 0 || index === points.length - 1) && <circle cx={point.x} cy={point.y} r={player.id === ME ? 4 : 3} fill="#060911" stroke={player.color} strokeWidth="2" />}
                                    <title>{`${player.name}, ${labelForIndex(index)}: ${point.score.toLocaleString()} earned · ${point.total.toLocaleString()} total`}</title>
                                </g>)}
                                {(avatarX !== last.x || avatarY !== last.y) && <line x1={last.x} y1={last.y} x2={avatarX} y2={avatarY} stroke={player.color} strokeWidth="2" strokeDasharray="3 4" opacity="0.7" />}
                                <g transform={`translate(${avatarX}, ${avatarY})`}>
                                    <circle r="18" fill="#05070a" stroke={player.color} strokeWidth="3" />
                                    <circle r="14" fill={`${player.color}33`} />
                                    <clipPath id={`avatar-clip-${player.id}`}><circle r="15" /></clipPath>
                                    <text y="6" textAnchor="middle" fontSize="15" fontWeight="900" fill={player.color}>{player.name[0]}</text>
                                    <image href={avatarUrl(player)} x="-15" y="-15" width="30" height="30" clipPath={`url(#avatar-clip-${player.id})`} />
                                    <title>{`${player.name} · ${formatScore(player.chartScore)} Challenge Score`}</title>
                                </g>
                            </g>;
                        })}
                        {tagLayouts.map(t => (
                            <g key={t.key} transform={`translate(${t.x}, ${t.y})`}>
                                <rect width={t.w} height={t.h} rx={t.h / 2} fill={t.color} fillOpacity="0.14" stroke={t.color} strokeOpacity="0.45" />
                                <text x={t.w / 2} y={t.h / 2 + 4.5} textAnchor="middle" fontSize="12" fontWeight="800" fill={t.color}>{t.text}</text>
                            </g>
                        ))}
                </svg>
                </div>
            );
        }

        // ---------- App ----------

            const fair = FairMath.calculateDailyScore({
                // Raw HRV stays in its source-specific metric; it is never converted across vendors.
                hrv: { value: bio.hrv, source: src, metric: SOURCES[src].hrv, baseline: { ...bio.hrvBaseline, source: src, metric: SOURCES[src].hrv }, freshnessHours: 4 },
                rhr: { value: bio.rhr, source: src, metric: SOURCES[src].rhr, baseline: { ...bio.rhrBaseline, source: src, metric: SOURCES[src].rhr }, freshnessHours: 4 },

            });
            const hrvC = fair.hrv.score || 0;

            const recovery = fair.recovery.score || 0;

            const recColor = recovery >= 67 ? '#34d399' : recovery >= 34 ? '#fbbf24' : '#f43f5e';

            const load = 0.6 * (fair.steps.targetAchievementRatio || 0) + 0.4 * Math.min(bio.kcal / bio.kcalGoal, 1.2);
            const strain = Math.round(21 * (1 - Math.exp(-1.4 * load)) * 10) / 10;
            const strainLabel = strain >= 18 ? 'All Out' : strain >= 14 ? 'Strenuous' : strain >= 10 ? 'Moderate' : 'Light';

            const currentDailyScore = fair.leaderboardEligible ? arenaScore : 0;
            const adj = (id) => scoreAdj[id] || 0;
            const myToday = clamp(currentDailyScore + adj(ME), 0, DAILY_MAX);
            const monthEntries = Object.fromEntries(Object.entries(MONTHLY_DAILY_SCORES).map(([id, arr]) => {
                const days = [...arr.slice(0, CHALLENGE_DAY - 1), Number(id) === ME ? currentDailyScore : arr[CHALLENGE_DAY - 1]];
                days[CHALLENGE_DAY - 1] = clamp(days[CHALLENGE_DAY - 1] + adj(id), 0, DAILY_MAX);
                return [id, days];
            }));
            const monthSquad = squad.map(member => {
                const dailyScores = monthEntries[member.id] || [];
                return { ...member, dailyScores, challengeScore: toChallengeScore(dailyScores.reduce((sum, score) => sum + score, 0)) };
            });
            const ranked = [...monthSquad].sort((a, b) => b.challengeScore - a.challengeScore);
            const myRank = ranked.findIndex(member => member.id === ME) + 1;
            const byId = Object.fromEntries(monthSquad.map(member => [member.id, member]));
            const me = byId[ME];
            const challengeRangeConfig = CHALLENGE_RANGES[challengeRange];
            const chartSquad = monthSquad.map(member => {
                const fairEntries = challengeRange === '3m'
                    ? QUARTERLY_WEEKLY_SCORES[member.id]
                    : challengeRange === '2w'
                        ? member.dailyScores.slice(-14)
                        : member.dailyScores;
                const chartEntries = fairEntries.map(toChallengeScore);
                return { ...member, chartEntries, chartScore: chartEntries.reduce((sum, score) => sum + score, 0) };
            });
            const intradayChartSquad = monthSquad.map(member => {
                const intradayEntries = [...INTRADAY_CHALLENGE_INCREMENTS[member.id]];
                if (member.id === ME) {
                    const accruedBeforeNow = intradayEntries.slice(0, -1).reduce((sum, score) => sum + score, 0);
                    intradayEntries[intradayEntries.length - 1] = Math.max(0, myToday - accruedBeforeNow);
                } else {
                    intradayEntries[intradayEntries.length - 1] = Math.max(0, intradayEntries[intradayEntries.length - 1] + adj(member.id));
                }
                const baseScore = toChallengeScore(member.dailyScores.slice(0, CHALLENGE_DAY - 1).reduce((sum, score) => sum + score, 0));
                const chartEntries = intradayEntries.map(toChallengeScore);
                return { ...member, baseScore, chartEntries, chartScore: baseScore + chartEntries.reduce((sum, score) => sum + score, 0) };
            });
            const tagsFor = (id) => Object.entries(scoreEvents.filter(e => e.id === id).reduce((acc, e) => ({ ...acc, [e.kind]: Math.round(((acc[e.kind] || 0) + e.v) * 10) / 10 }), {}))
                .filter(([, v]) => v).map(([kind, v]) => ({ kind, v }));
            const activeChartSquad = (challengeZoom === '12h' ? intradayChartSquad : chartSquad)
                .map(m => ({ ...m, tags: challengeZoom === '12h' ? tagsFor(m.id) : [] }));
            const chartPointLabel = challengeZoom === '12h' ? 'Time' : challengeRangeConfig.pointLabel;
            const chartLabelForIndex = challengeZoom === '12h'
                ? (index) => INTRADAY_LABELS[index]
                : (index) => `${challengeRangeConfig.pointLabel} ${index + 1}`;

            // ---------- Feed helpers ----------
            const post = (msg) => {
                setMessages(prev => [...prev, { id: uid(), time: fmtTime(new Date()), reactions: {}, ...msg }]);
                if (tabRef.current !== 'chat') setUnread(u => u + 1);
            };
            const updateMsg = (id, fn) => setMessages(prev => prev.map(m => (m.id === id ? fn(m) : m)));
            const toggleReaction = (id, emoji, userId = ME) => updateMsg(id, (m) => {
                const r = { ...(m.reactions || {}) };
                const list = r[emoji] || [];
                r[emoji] = list.includes(userId) ? list.filter(u => u !== userId) : [...list, userId];
                if (!r[emoji].length) delete r[emoji];
                return { ...m, reactions: r };
            });
            const others = () => squad.filter(m => m.id !== ME);
            const randomOther = () => { const o = others(); return o[Math.floor(Math.random() * o.length)]; };

            const simulateReplies = (msgId) => {
                const responder = randomOther();
                setTimeout(() => toggleReaction(msgId, REACTIONS[Math.floor(Math.random() * 3)], randomOther().id), 900);
                setTimeout(() => setTyping(responder.id), 1300);
                setTimeout(() => {
                    setTyping(null);
                    const lines = REPLIES[responder.id];
                    post({ type: 'text', userId: responder.id, text: lines[Math.floor(Math.random() * lines.length)] });
                    updateMsg(msgId, m => ({ ...m, seenBy: others().map(o => o.id) }));
                }, 3000);
            };

            const sendText = (text) => {
                const t = text.trim();
                if (!t) return;
                const id = uid();
                setMessages(prev => [...prev, { id, type: 'text', userId: ME, text: t, time: fmtTime(new Date()), reactions: {} }]);
                setInput('');
                simulateReplies(id);
            };

            useEffect(() => {
                const clock = setInterval(() => setNow(new Date()), 1000);
                return () => clearInterval(clock);
            }, []);

            // ---------- Maps engine ----------
            const [mapMode, setMapMode] = useState('live');
            const [selRoute, setSelRoute] = useState('r1');
            const [map, setMap] = useState({ live: LIVE_INIT, hexes: HEXES_INIT, routes: ROUTES_INIT, run: null, trails: { 1: [], 2: [], 3: [], 4: [] }, rally: null });
            const [center, setCenter] = useState(DEFAULT_CENTER);
            const [follow, setFollow] = useState(true);
            const [focus, setFocus] = useState(null);
            const [rallyArm, setRallyArm] = useState(false);
            const [shareLocation, setShareLocation] = useState(true);
            const [geoNote, setGeoNote] = useState('');
            const mapRef = useRef(map);
            const stealRef = useRef({});
            const leaderRef = useRef(null);
            const tickRef = useRef(0);
            const commitMap = (next) => { mapRef.current = next; setMap(next); };
            const routeOf = (s, id) => s.routes.find(r => r.id === id);
            const isMoving = (s, id) => (id === ME ? !!s.run : !!s.live[id].route);
            const posOf = (s, id) => {
                if (id === ME && s.run) return pointAt(routeOf(s, s.run.routeId).pts, s.run.t);
                const lv = s.live[id];
                return lv.route ? pointAt(routeOf(s, lv.route).pts, lv.t) : lv.home;
            };
            const hexCount = (hexes, id) => Object.values(hexes).filter(o => o === id).length;

            const mapTick = () => {
                const s = mapRef.current;
                tickRef.current += 1;
                const live = {};
                Object.entries(s.live).forEach(([k, lv]) => {
                    if (!lv.route) { live[k] = lv; return; }
                    let dir = lv.dir || 1, t = lv.t + lv.speed * dir;
                    if (lv.pingpong) { if (t >= 1) { t = 1; dir = -1; } if (t <= 0) { t = 0; dir = 1; } }
                    else t = t % 1;
                    live[k] = { ...lv, t, dir };
                });
                let run = s.run, finished = null;
                if (run) { run = { ...run, t: Math.min(1, run.t + 1 / RUN_TICKS) }; if (run.t >= 1) finished = run; }
                let next = { ...s, live, run };

                // Paint hexes along each mover's path since the last tick.
                const hexes = { ...s.hexes }, trails = {};
                let myCaps = 0;
                SQUAD_INIT.forEach(m => {
                    if (!isMoving(next, m.id)) { trails[m.id] = []; return; }
                    const to = posOf(next, m.id);
                    const from = isMoving(s, m.id) ? posOf(s, m.id) : to;
                    [0.5, 1].forEach(f => {
                        const id = pxToHexId(from[0] + (to[0] - from[0]) * f, from[1] + (to[1] - from[1]) * f);
                        if (!(id in hexes) || hexes[id] === m.id) return;
                        if (hexes[id] === ME && m.id !== ME) stealRef.current[m.id] = (stealRef.current[m.id] || 0) + 1;
                        hexes[id] = m.id;
                        if (m.id === ME) myCaps += 1;
                    });
                    trails[m.id] = [...(s.trails[m.id] || []), to].slice(-14);
                });
                if (run) run = { ...run, captured: (run.captured || 0) + myCaps };
                next = { ...next, run, hexes, trails };

                const events = [];
                if (tickRef.current % 12 === 0) {
                    Object.entries(stealRef.current).forEach(([id, n]) => events.push({ type: 'system', text: `🗺️ ${nameOf(id)} stole ${n} of your hexes`, alert: true }));
                    stealRef.current = {};
                }
                const leader = SQUAD_INIT.map(m => [m.id, hexCount(hexes, m.id)]).sort((a, b) => b[1] - a[1])[0];
                if (leaderRef.current && leaderRef.current !== leader[0]) events.push({ type: 'system', text: `👑 ${nameOf(leader[0])} now ${leader[0] === ME ? 'control' : 'controls'} the most territory (${leader[1]} hexes)` });
                leaderRef.current = leader[0];

                if (finished) {
                    const r = routeOf(s, finished.routeId);
                    const time = Math.round(finished.target);
                    const king = r.record;
                    const newKing = time < king.time && king.userId !== ME;
                    const pb = time < r.best;
                    next = { ...next, run: null, trails: { ...next.trails, [ME]: [] }, routes: next.routes.map(x => x.id === r.id
                        ? { ...x, best: Math.min(x.best, time), record: time < x.record.time ? { userId: ME, time } : x.record } : x) };
                    events.push({ type: 'activity', userId: ME, activity: { icon: '🏃', title: r.name, stats: [[`${r.km} km`, 'Distance'], [fmtClock(time), 'Time'], [`+${run.captured}`, 'Hexes']] } });
                    events.push({ type: 'system', text: time < king.time ? `👻 You beat ${king.userId === ME ? 'your own' : `${nameOf(king.userId)}’s`} ghost by ${king.time - time}s` : `👻 ${king.userId === ME ? 'Your old self' : `${nameOf(king.userId)}’s ghost`} won by ${time - king.time}s`, alert: time >= king.time });
                    if (newKing) events.push({ type: 'system', text: `👑 You’re the new King of ${r.name}!` });
                    else if (pb) events.push({ type: 'system', text: `⚡ New PB on ${r.name}: ${fmtClock(time)}` });
                }
                commitMap(next);
                events.forEach(post);
            };

            useEffect(() => {
                const id = setInterval(mapTick, 1000);
                return () => clearInterval(id);
            }, []);

            const startRun = (routeId) => {
                const r = routeOf(mapRef.current, routeId);
                setFollow(true);
                commitMap({ ...mapRef.current, run: { routeId, t: 0, captured: 0, target: r.best * (0.9 + Math.random() * 0.14) } });
            };
            const stopRun = () => commitMap({ ...mapRef.current, run: null, trails: { ...mapRef.current.trails, [ME]: [] } });
            const placeRally = (latlng) => {
                const [x, y] = toPx(center, latlng.lat, latlng.lng);
                commitMap({ ...mapRef.current, rally: { x, y, label: '6 PM run' } });
                setRallyArm(false);
                post({ type: 'system', text: '📍 You dropped a rally point for a 6 PM squad run' });
                setTimeout(() => post({ type: 'text', userId: 2, text: 'Pulling up 🏃' }), 2000);
                setTimeout(() => post({ type: 'text', userId: 4, text: 'In. Loser buys smoothies 🥤' }), 3800);
            };
            const useMyLocation = () => {
                if (!navigator.geolocation) { setGeoNote('Location isn’t available in this browser'); return; }
                setGeoNote('Finding you…');
                navigator.geolocation.getCurrentPosition(
                    (pos) => { setCenter([pos.coords.latitude, pos.coords.longitude]); setGeoNote(''); },
                    () => setGeoNote('Location blocked: showing the demo area'),
                    { timeout: 8000 },
                );
            };

            useEffect(() => {
                if (tab === 'chat') chatEndRef.current?.scrollIntoView({ behavior: 'smooth', block: 'end' });
            }, [messages.length, typing, tab]);

            useEffect(() => {
                if (!snapView) return;
                const t = setTimeout(() => setSnapView(null), 4000);
                return () => clearTimeout(t);
            }, [snapView]);

            const simulateSync = () => {
                if (refreshing) return;
                setRefreshing(true);
                setTimeout(() => {
                    setBio(prev => ({ ...prev, steps: prev.steps + 450, kcal: prev.kcal + 25 }));
                    setRefreshing(false);
                }, 700);
            };

            // ---------- Feed actions ----------
            const shareStats = () => {
                setSheet(null);
                const id = uid();
                setMessages(prev => [...prev, { id, type: 'stats', userId: ME, time: fmtTime(new Date()), reactions: {},
                    stats: { recovery, recColor, strain, steps: bio.steps, sleep: fmtHM(sleepMin), rank: myRank } }]);
                simulateReplies(id);
            };
            const sendSnap = (preset) => {
                setSheet(null);
                const id = uid();
                setMessages(prev => [...prev, { id, type: 'snap', userId: ME, time: fmtTime(new Date()), reactions: {}, snap: preset }]);
                simulateReplies(id);
            };
            const sendPoll = () => {
                if (!pollDraft.q.trim()) return;
                setSheet(null);
                post({ type: 'poll', userId: ME, poll: { q: pollDraft.q.trim(), options: [{ label: pollDraft.a || 'Yes', votes: [] }, { label: pollDraft.b || 'No', votes: [] }] } });
                setPollDraft({ q: '', a: 'I’m in 🙋', b: 'Pass' });
            };
            const vote = (msgId, idx, userId = ME) => updateMsg(msgId, (m) => ({
                ...m, poll: { ...m.poll, options: m.poll.options.map((o, i) => ({ ...o, votes: i === idx ? (o.votes.includes(userId) ? o.votes : [...o.votes, userId]) : o.votes.filter(v => v !== userId) })) },
            }));
            const nudge = (m) => { setProfile(null); post({ type: 'system', text: `👉 You nudged ${m.name} to get moving` }); setTimeout(() => post({ type: 'text', userId: m.id, text: 'ok ok I’m up 😤' }), 2200); };
            // ---------- Challenge pools ----------
            // 1. 1v1 duels:           winner +2, loser −2 on today's score.
            // 2. Squad challenges:     sent by a player (incl. Phone Down). React to join. At the end of the day every
            //                          player who didn't finish loses 2; those points are split between the finishers.
            // 3. Clutch:               announced by Clutch 12 hours ahead. Everyone in the group is in. Same split rule.
            // 4. Bonus:                sent by Clutch at random. Opt in; everyone who finishes earns points, nobody is penalized.
            const ALL_MEMBERS = [...SQUAD_INIT, ...MORNING_RUNNERS];
            const nameOf = (id) => (Number(id) === ME ? 'You' : (ALL_MEMBERS.find(x => x.id === Number(id)) || {}).name);
            const joinedOf = (msg) => [...new Set([...(msg.type === 'bonus' ? [] : [msg.userId]), ...Object.values(msg.reactions || {}).flat()])];
            const leftSec = (endsAt) => Math.max(0, Math.ceil((endsAt - now.getTime()) / 1000));
            const fmtPts = (v) => { const n = Math.abs(v); return `${v > 0 ? '+' : v < 0 ? '−' : ''}${Number.isInteger(n) ? n : n.toFixed(1)} pts`; };
            const addPoints = (delta, kind) => {
                setScoreEvents(ev => [...ev, ...Object.entries(delta).filter(([, v]) => v).map(([id, v]) => ({ id: Number(id), v, kind }))]);
                setScoreAdj(p => {
                const n = { ...p };
                Object.entries(delta).forEach(([k, v]) => { n[k] = Math.round(((n[k] || 0) + v) * 10) / 10; });
                return n;
            });
            };
            const simJoin = (id, chance = 0.75) => others().forEach((o, i) => {
                if (Math.random() < chance) setTimeout(() => toggleReaction(id, REACTIONS[Math.floor(Math.random() * REACTIONS.length)], o.id), 1200 + i * 1100 + Math.random() * 900);
            });
            // Split rule for squad challenges: non-finishers −STAKE each, finishers share the total.
            const splitDelta = (finished, failed) => {
                if (!finished.length || !failed.length) return {};
                const share = Math.round(((STAKE * failed.length) / finished.length) * 10) / 10;
                const d = {};
                failed.forEach(id => { d[id] = -STAKE; });
                finished.forEach(id => { d[id] = share; });
                return d;
            };

            const resolveGame = (id) => {
                const msg = messagesRef.current.find(m => m.id === id);
                if (!msg || msg.result) return;
                const players = joinedOf(msg);
                const finished = players.filter(() => Math.random() < 0.65);
                const failed = players.filter(p => !finished.includes(p));
                if (msg.type === 'bonus') {
                    if (!players.length) { updateMsg(id, m => ({ ...m, result: { none: true } })); return; }
                    const delta = Object.fromEntries(finished.map(p => [p, msg.bonus.reward]));
                    addPoints(delta, 'bonus');
                                        updateMsg(id, m => ({ ...m, result: { finished, failed, delta } }));
                    post({ type: 'system', text: `💥 Just do it: ${finished.length}/${players.length} finished · +${msg.bonus.reward} pts each` });
                    return;
                }
                if (players.length < 2) {
                    updateMsg(id, m => ({ ...m, result: { none: true } }));
                    post({ type: 'system', text: `🏁 “${msg.challenge.title}” closed: nobody took it` });
                    return;
                }
                const delta = splitDelta(finished, failed);
                addPoints(delta, 'squad');
                updateMsg(id, m => ({ ...m, result: { finished, failed, delta } }));
                post({ type: 'system', text: `🏁 “${msg.challenge.title}”: ${finished.length} finished, ${failed.length} didn’t${delta[ME] ? ` · you ${fmtPts(delta[ME])}` : ''}`, alert: (delta[ME] || 0) < 0 });
            };

            // ---- Send limit: 3 challenges (squad, Phone Down or 1v1) per day ----
            const sendsLeft = Math.max(0, MAX_SENDS - sentCount);
            const flash = (text) => { setToast(text); setTimeout(() => setToast(''), 2600); };
            const useSend = () => {
                if (sentCount >= MAX_SENDS) { setSheet(null); flash(`You’ve sent all ${MAX_SENDS} challenges for today`); return false; }
                setSentCount(c => c + 1);
                return true;
            };
            // If nobody else accepts in time, the challenge is removed.
            const expireIfUnaccepted = (id, title) => {
                const msg = messagesRef.current.find(m => m.id === id);
                if (!msg || joinedOf(msg).some(p => p !== ME)) return;
                setMessages(prev => prev.filter(m => m.id !== id));
                post({ type: 'system', text: `⌛ Nobody accepted ${title}. It’s gone.` });
            };

            const sendChallenge = () => {
                if (!useSend()) return;
                const v = VARIABLES.find(x => x.key === draft.metric);
                setSheet(null);
                const id = uid();
                setMessages(prev => [...prev, { id, type: 'challenge', userId: ME, time: fmtTime(new Date()), reactions: {}, challenge: { title: v.title, icon: v.icon, acceptBy: Date.now() + 12000, endsAt: Date.now() + 30000 } }]);
                simJoin(id, 0.6);
                setTimeout(() => expireIfUnaccepted(id, `“${v.title}”`), 12000);
                setTimeout(() => resolveGame(id), 30000);
            };

            // ---- Clutch: scheduled, mandatory for the whole group ----
            // Your own result is computed on this device. For screen time on iPhone this would come from a
            // DeviceActivity threshold event (Screen Time API): the app only learns "limit crossed: yes / no".
            const clutchCheck = (c) => {
                if (c.kind === 'screen') {
                    const pass = bio.screen.total <= c.limit;
                    return { pass, note: pass ? `${fmtHM(c.limit - bio.screen.total)} left under the limit` : 'Over the limit' };
                }
                const pass = sleepMin >= c.target;
                return { pass, note: pass ? `${fmtHM(sleepMin)} last night` : 'Under 7h' };
            };
            const settleClutch = (id) => {
                const c = clutches.find(x => x.id === id);
                if (!c || c.status === 'done') return;
                const finished = squad.filter(m => (m.id === ME ? clutchCheck(c).pass : c.squadPass[m.id])).map(m => m.id);
                const failed = squad.map(m => m.id).filter(x => !finished.includes(x));
                const delta = splitDelta(finished, failed);
                addPoints(delta, 'clutch');
                if (finished.includes(ME)) setGameStats(st => ({ ...st, clutchWins: st.clutchWins + 1 }));
                setClutches(cs => cs.map(x => (x.id === id ? { ...x, status: 'done', result: { finished, failed, delta } } : x)));
                post({ type: 'system', text: `⚡ Clutch “${c.title}”: ${finished.length} passed, ${failed.length} didn’t${delta[ME] ? ` · you ${fmtPts(delta[ME])}` : ''}`, alert: (delta[ME] || 0) < 0 });
            };
            const startClutch = (id) => setClutches(cs => cs.map(x => (x.id === id ? { ...x, status: 'live' } : x)));

            const triggerBonus = () => {
                const c = BONUS_CHALLENGES[Math.floor(Math.random() * BONUS_CHALLENGES.length)];
                const id = uid();
                setMessages(prev => [...prev, { id, type: 'bonus', time: fmtTime(new Date()), reactions: {}, bonus: { ...c, endsAt: Date.now() + 25000 } }]);
                if (tabRef.current !== 'chat') setUnread(u => u + 1);
                simJoin(id, 0.7);
                setTimeout(() => resolveGame(id), 25000);
            };
            useEffect(() => {
                const first = setTimeout(() => settingsRef.current.bonus && triggerBonus(), 12000);
                const loop = setInterval(() => settingsRef.current.bonus && triggerBonus(), 90000);
                return () => { clearTimeout(first); clearInterval(loop); };
            }, []);

            // Phone Down is a squad challenge: whoever picks up first didn't finish (−2), the rest split it.
            const pickUp = (id, who) => {
                const msg = messagesRef.current.find(m => m.id === id);
                if (!msg || msg.result) return;
                const players = joinedOf(msg);
                if (!players.includes(who)) return;
                const finished = players.filter(p => p !== who);
                const delta = splitDelta(finished, [who]);
                addPoints(delta, 'squad');
                updateMsg(id, m => ({ ...m, result: { loser: who, finished, failed: [who], delta } }));
                post({ type: 'system', text: `📵 ${nameOf(who)} picked up first · ${fmtPts(-STAKE)}`, alert: who === ME });
            };
            const endPhoneDown = (id) => {
                const msg = messagesRef.current.find(m => m.id === id);
                if (!msg || msg.result) return;
                const players = joinedOf(msg);
                updateMsg(id, m => ({ ...m, result: { survived: players, finished: players, failed: [], delta: {} } }));
                if (players.includes(ME)) setGameStats(st => ({ ...st, phoneDownSurvived: st.phoneDownSurvived + 1 }));
                post({ type: 'system', text: `📵 Phone Down complete: all ${players.length} held strong 💪` });
            };
            const startPhoneDown = () => {
                if (!useSend()) return false;
                setSheet(null);
                const id = uid(), dur = 30000;
                setMessages(prev => [...prev, { id, type: 'phonedown', userId: ME, time: fmtTime(new Date()), reactions: {}, phonedown: { mins: settingsRef.current.phoneDownMins, startsAt: Date.now(), dur } }]);
                simJoin(id, 0.7);
                setTimeout(() => expireIfUnaccepted(id, 'your Phone Down'), 8000);
                setTimeout(() => {
                    const msg = messagesRef.current.find(m => m.id === id);
                    const sims = msg ? joinedOf(msg).filter(p => p !== ME) : [];
                    if (sims.length && Math.random() < 0.6) pickUp(id, sims[Math.floor(Math.random() * sims.length)]);
                }, 9000 + Math.random() * 15000);
                setTimeout(() => endPhoneDown(id), dur);
            };

            // 1v1 duels: winner +2, loser −2.
            const startDuel = () => {
                if (!useSend()) return;
                const { opp, metric } = draft, v = VARIABLES.find(x => x.key === metric);
                const accepts = Math.random() < 0.7;
                const id = uid(), dur = 35000;
                setSheet(null);
                setPool('duels');
                setDuels(ds => [{ id, opp, metric, status: 'pending', startsAt: Date.now() + 1800, dur, rateMe: 0.6 + Math.random() * 0.4, rateOpp: 0.6 + Math.random() * 0.4 }, ...ds]);
                post({ type: 'system', text: `⚔️ You challenged ${nameOf(opp)} to a ${v.label} duel · ±${STAKE} pts` });
                if (!accepts) {
                    // Not accepted in time: the duel is gone.
                    setTimeout(() => {
                        setDuels(ds => ds.filter(d => d.id !== id));
                        post({ type: 'system', text: `⌛ ${nameOf(opp)} didn’t accept your duel. It’s gone.` });
                    }, 6000);
                    return;
                }
                setTimeout(() => {
                    setDuels(ds => ds.map(d => (d.id === id ? { ...d, status: 'live' } : d)));
                    post({ type: 'system', text: `⚔️ ${nameOf(opp)} accepted your duel` });
                }, 1800);
                setTimeout(() => {
                    const d = duelsRef.current.find(x => x.id === id);
                    if (!d || d.status === 'done') return;
                    const w = d.rateMe >= d.rateOpp ? ME : d.opp, l = w === ME ? d.opp : ME;
                    addPoints({ [w]: STAKE, [l]: -STAKE }, 'duel');
                    if (w === ME) setGameStats(st => ({ ...st, duelWins: st.duelWins + 1 }));
                    setDuels(ds => ds.map(x => (x.id === id ? { ...x, status: 'done', winner: w } : x)));
                    post({ type: 'system', text: w === ME ? `⚔️ You beat ${nameOf(d.opp)} in the ${v.label} duel · +${STAKE} pts` : `⚔️ ${nameOf(d.opp)} beat you in the ${v.label} duel · −${STAKE} pts`, alert: w !== ME });
                }, 1800 + dur);
            };
            const openDuel = (opp) => { setProfile(null); setPage(null); setDraft(d => ({ ...d, opp })); setSheet('duel'); };

            // ---------- Derived: rival, badges, awards, stories ----------
            const enabledVars = VARIABLES.filter(v => v.title && (v.core || extras[v.key]));
            const rival = (() => {
                const i = ranked.findIndex(m => m.id === ME);
                return [ranked[i - 1], ranked[i + 1]].filter(Boolean)
                    .sort((a, b) => Math.abs(a.challengeScore - me.challengeScore) - Math.abs(b.challengeScore - me.challengeScore))[0];
            })();
            const myZones = hexCount(map.hexes, ME);
            const isG1 = group === 'g1';
            const badges = BADGES.map(b => {
                const prog = isG1 ? ({ clutch: gameStats.clutchWins, duel: gameStats.duelWins, phone: gameStats.phoneDownSurvived, turf: myZones }[b.id] ?? b.have) : G2.badges[b.id];
                return { ...b, have: Math.min(prog, b.need), earned: prog >= b.need };
            });
            // Profile, streaks, badges and stories all follow the selected group.
            const gp = isG1
                ? { rank: myRank, size: squad.length, challenge: me.challengeScore, today: myToday, streaks: { sleep: SQUAD_EXTRA[ME].sleepStreak, curfew: SQUAD_EXTRA[ME].curfewStreak, steps: SQUAD_EXTRA[ME].stepStreak } }
                : { rank: G2.rank, size: G2.members.length, challenge: G2.challenge, today: G2.today, streaks: G2.streaks };
            const roster = isG1
                ? squad.map(m => ({ ...byId[m.id], stress: SQUAD_EXTRA[m.id].stress, vo2: SQUAD_EXTRA[m.id].vo2, curfewLast: SQUAD_EXTRA[m.id].curfewLast }))
                : G2.members.map(id => ({ ...(ALL_MEMBERS.find(x => x.id === id)), ...G2.stats[id] }));
            const rosterById = Object.fromEntries(roster.map(m => [m.id, m]));
            const groupObj = GROUPS.find(g => g.id === group);
            const chillest = [...roster].sort((a, b) => a.stress - b.stress)[0];
            const mvp = [...roster].sort((a, b) => b.recovery - a.recovery)[0];
            const vo2Top = [...roster].sort((a, b) => b.vo2 - a.vo2)[0];
            const leaderId = isG1 ? ranked[0].id : G2.leader;
            const turfTop = squad.map(m => ({ id: m.id, count: hexCount(map.hexes, m.id) })).sort((a, b) => b.count - a.count)[0];
            const curfewFails = roster.filter(m => !m.curfewLast);
            const hero = (id) => <Avatar m={rosterById[id]} size={110} />;
            const dailySlides = [
                { bg: 'linear-gradient(160deg,#1a2e05,#05070a 70%)', kicker: 'MVP of the day', hero: hero(mvp.id), title: `${nameOf(mvp.id)} woke up at ${mvp.recovery}%`, sub: `Highest recovery in ${groupObj.name}` },
                { bg: 'linear-gradient(160deg,#064e3b,#05070a 70%)', kicker: 'Most chill', hero: hero(chillest.id), title: `${nameOf(chillest.id)} stayed calm`, sub: `Average stress ${chillest.stress}/100` },
                { bg: 'linear-gradient(160deg,#312e81,#05070a 70%)', kicker: 'Curfew report', title: `${roster.length - curfewFails.length}/${roster.length} made curfew`,
                  hero: <div className="flex -space-x-3">{roster.map(m => <div key={m.id} className={m.curfewLast ? '' : 'opacity-40 grayscale'}><Avatar m={m} size={roster.length > 5 ? 44 : 58} /></div>)}</div>,
                  sub: curfewFails.length ? `${curfewFails.map(m => nameOf(m.id)).join(', ')} broke it 👀` : 'Perfect night 🌙' },
                { bg: 'linear-gradient(160deg,#78350f,#05070a 70%)', kicker: 'Challenge leader', hero: hero(leaderId), title: `${nameOf(leaderId)} ${leaderId === ME ? 'are' : 'is'} #1 this month`, sub: groupObj.name },
                { bg: 'linear-gradient(160deg,#0e7490,#05070a 70%)', kicker: 'Your day', title: `${bio.steps.toLocaleString()} steps · ${fmtHM(sleepMin)} sleep`, sub: `#${gp.rank} of ${gp.size} in ${groupObj.name}`,
                  hero: <Ring value={recovery} size={130} stroke={10} color={recColor}><span className="text-4xl font-black" style={{ color: recColor }}>{recovery}%</span></Ring> },
            ];
            const weeklySlides = [
                { bg: 'linear-gradient(160deg,#701a75,#05070a 70%)', kicker: `${groupObj.name} this week`, hero: <p className="text-7xl font-black text-white">{isG1 ? '271k' : G2.week.steps}</p>, title: 'steps together', sub: isG1 ? '58.4 km run · 14 workouts' : G2.week.sub },
                { bg: 'linear-gradient(160deg,#4c1d95,#05070a 70%)', kicker: 'Top sleeper', hero: hero(isG1 ? 2 : G2.week.sleeper[0]), title: isG1 ? 'Anshu averaged 8h 05m' : G2.week.sleeper[1], sub: '6 of 7 nights in the optimal window' },
                { bg: 'linear-gradient(160deg,#075985,#05070a 70%)', kicker: 'Highest VO₂ max', hero: hero(vo2Top.id), title: `${nameOf(vo2Top.id)} · ${vo2Top.vo2}`, sub: 'Cardio fitness crown 🫁' },
                isG1
                    ? { bg: 'linear-gradient(160deg,#14532d,#05070a 70%)', kicker: 'Turf boss', hero: hero(turfTop.id), title: `${nameOf(turfTop.id)} ${turfTop.id === ME ? 'hold' : 'holds'} ${turfTop.count} hexes`, sub: 'Run through hexes on Maps to steal them' }
                    : { bg: 'linear-gradient(160deg,#14532d,#05070a 70%)', kicker: 'Clutch champ', hero: hero(G2.week.clutchChamp[0]), title: G2.week.clutchChamp[1], sub: '5 for 5 this week ⚡' },
                { bg: 'linear-gradient(160deg,#3f6212,#05070a 70%)', kicker: 'Your week', hero: <p className="text-7xl font-black text-[#c8ff00]">#{gp.rank}</p>, title: `${gp.streaks.curfew}-night curfew streak · ${gp.challenge.toLocaleString()} pts`, sub: `${badges.filter(b => b.earned).length} badges unlocked` },
            ];
            const storyLen = story ? (story.kind === 'daily' ? dailySlides : weeklySlides).length : 0;
            useEffect(() => {
                if (!story) return;
                const t = setTimeout(() => setStory(st => (!st ? st : st.idx < storyLen - 1 ? { ...st, idx: st.idx + 1 } : null)), 4000);
                return () => clearTimeout(t);
            }, [story, storyLen]);

            // ---------- Small UI helpers ----------
            const deltaRow = (delta) => (
                <div className="flex flex-wrap gap-1.5 mt-2">
                    {Object.entries(delta).map(([id, v]) => (
                        <span key={id} className={`flex items-center gap-1 text-[10px] font-black pl-0.5 pr-1.5 py-0.5 rounded-full border ${v > 0 ? 'text-emerald-300 border-emerald-500/30 bg-emerald-500/10' : v < 0 ? 'text-rose-300 border-rose-500/30 bg-rose-500/10' : 'text-slate-400 border-slate-700'}`}>
                            <Avatar m={byId[id]} size={14} />{fmtPts(v)}
                        </span>
                    ))}
                </div>
            );
            const joinControl = (msg) => (joinedOf(msg).includes(ME)
                ? <span className="text-[10px] font-black text-emerald-400">✓ You’re in</span>
                : <button onClick={(e) => { e.stopPropagation(); toggleReaction(msg.id, '🔥'); }} className="text-[11px] font-black bg-[#c8ff00] text-black px-3 py-1.5 rounded-lg">🔥 React to join</button>);
            const metricPicker = (
                <div>
                    <p className="text-[10px] uppercase font-black text-slate-500 mb-1.5">Variable</p>
                    <div className="flex flex-wrap gap-2">
                        {enabledVars.map(v => <button key={v.key} onClick={() => setDraft(d => ({ ...d, metric: v.key }))} className={`px-3 py-2 rounded-xl text-xs font-black border transition ${draft.metric === v.key ? 'bg-[#c8ff00] text-black border-[#c8ff00]' : 'bg-[#0e1422] border-slate-800 text-slate-300'}`}>{v.icon} {v.label}</button>)}
                    </div>
                    <p className="text-[11px] font-bold text-slate-300 mt-2">“{(VARIABLES.find(v => v.key === draft.metric) || {}).title}”</p>
                </div>
            );
            const hype = (m) => { setProfile(null); post({ type: 'system', text: `🔥 You hyped ${m.name}` }); };

            // ---------- Render: message ----------
            const renderMessage = (msg, i) => {
                if (msg.type === 'system') {
                    return (
                        <div key={msg.id} className="flex justify-center animate-fadeIn">
                            <span className={`text-[10px] font-bold px-3 py-1.5 rounded-full border ${msg.alert ? 'bg-rose-500/10 border-rose-500/30 text-rose-300' : 'bg-cyan-950/40 border-cyan-800/40 text-cyan-300'}`}>
                                {msg.text} <span className="text-slate-500 font-medium ml-1">{msg.time}</span>
                            </span>
                        </div>
                    );
                }
                if (msg.type === 'bonus') {
                    const c = msg.bonus, players = joinedOf(msg);
                    const rx = Object.entries(msg.reactions || {});
                    return (
                        <div key={msg.id} className="flex flex-col items-center animate-fadeIn">
                            <div className="relative w-[90%] rounded-2xl p-[1.5px] bg-gradient-to-r from-[#c8ff00] via-amber-400 to-[#c8ff00] cursor-pointer" onClick={() => setPicker(picker === msg.id ? null : msg.id)}>
                                <div className="rounded-[15px] bg-[#0b0f08] p-3.5">
                                    <div className="flex justify-between items-center">
                                        <p className="text-[9px] uppercase font-black tracking-[0.2em] text-[#c8ff00]">💥 Just do it · from Clutch</p>
                                        <span className="text-[10px] font-black text-amber-300">+{c.reward} pts each</span>
                                    </div>
                                    <p className="text-sm font-black text-white mt-1">{c.icon} {c.title}</p>
                                    {msg.result ? (msg.result.none
                                        ? <p className="text-[11px] font-bold text-slate-500 mt-2">Expired: nobody joined</p>
                                        : <><p className="text-[11px] font-black text-[#c8ff00] mt-2">✅ {msg.result.finished.length} of {msg.result.finished.length + msg.result.failed.length} finished · no penalty</p>{deltaRow(msg.result.delta)}</>)
                                        : (
                                        <div className="flex items-center justify-between mt-3">
                                            <div className="flex items-center gap-2">
                                                <div className="flex -space-x-2">{players.map(v => <div key={v} className="animate-pop"><Avatar m={byId[v]} size={22} /></div>)}</div>
                                                <span className="text-xs font-black font-mono text-amber-300">{fmtClock(leftSec(c.endsAt))}</span>
                                            </div>
                                            {joinControl(msg)}
                                        </div>
                                    )}
                                </div>
                                {picker === msg.id && (
                                    <div className="absolute z-20 -top-11 left-0 flex gap-1 bg-[#141b2b] border border-slate-700 rounded-full px-2 py-1.5 shadow-2xl animate-pop">
                                        {REACTIONS.map(e => <button key={e} onClick={(ev) => { ev.stopPropagation(); toggleReaction(msg.id, e); setPicker(null); }} className="text-lg hover:scale-125 transition">{e}</button>)}
                                    </div>
                                )}
                            </div>
                            {rx.length > 0 && (
                                <div className="flex gap-1 -mt-1.5 relative z-10">
                                    {rx.map(([e, users]) => <button key={e} onClick={() => toggleReaction(msg.id, e)} className={`text-[10px] px-1.5 py-0.5 rounded-full border animate-pop ${users.includes(ME) ? 'bg-cyan-500/20 border-cyan-500/50' : 'bg-[#141b2b] border-slate-700'}`}>{e} <span className="text-slate-300 font-bold">{users.length}</span></button>)}
                                </div>
                            )}
                        </div>
                    );
                }
                const m = byId[msg.userId];
                const mine = msg.userId === ME;
                const prev = messages[i - 1];
                const grouped = prev && prev.userId === msg.userId && prev.type !== 'system';
                const reactions = Object.entries(msg.reactions || {});

                let body;
                if (msg.type === 'text') {
                    body = (
                        <div className={`px-3.5 py-2.5 text-[13px] leading-snug font-medium break-words select-text ${mine ? 'bg-cyan-500 text-slate-950 rounded-2xl rounded-br-md' : 'bg-[#141b2b] text-slate-100 rounded-2xl rounded-bl-md border border-slate-800'}`}>
                            {msg.text}
                        </div>
                    );
                } else if (msg.type === 'activity') {
                    body = (
                        <div className="w-60 rounded-2xl overflow-hidden border border-slate-800 bg-[#0b111d]">
                            <div className="px-3.5 py-2.5 flex items-center gap-2" style={{ background: `linear-gradient(90deg, ${m.color}33, transparent)` }}>
                                <span className="text-xl">{msg.activity.icon}</span>
                                <div>
                                    <p className="text-[9px] uppercase font-black tracking-widest text-slate-400">Workout logged</p>
                                    <p className="text-sm font-black text-white">{msg.activity.title}</p>
                                </div>
                            </div>
                            <div className="grid grid-cols-3 divide-x divide-slate-800 border-t border-slate-800">
                                {msg.activity.stats.map(([v, l]) => (
                                    <div key={l} className="py-2 text-center">
                                        <p className="text-sm font-black text-white">{v}</p>
                                        <p className="text-[9px] text-slate-500 uppercase font-bold">{l}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    );
                } else if (msg.type === 'stats') {
                    const s = msg.stats;
                    body = (
                        <div className="w-60 rounded-2xl border border-cyan-500/30 bg-gradient-to-br from-cyan-950/70 to-[#0b111d] p-3.5">
                            <p className="text-[9px] uppercase font-black tracking-widest text-cyan-400">{m.name}’s day • {ordinal(s.rank)} this month</p>
                            <div className="flex items-center gap-3 mt-2">
                                <Ring value={s.recovery} size={58} stroke={6} color={s.recColor}>
                                    <span className="text-sm font-black" style={{ color: s.recColor }}>{s.recovery}%</span>
                                </Ring>
                                <div className="grid grid-cols-1 gap-0.5 text-[11px]">
                                    <span className="text-slate-300"><b className="text-blue-400">{s.strain}</b> strain</span>
                                    <span className="text-slate-300"><b className="text-white">{s.steps.toLocaleString()}</b> steps</span>
                                    <span className="text-slate-300"><b className="text-violet-300">{s.sleep}</b> sleep</span>
                                </div>
                            </div>
                        </div>
                    );
                } else if (msg.type === 'snap') {
                    if (mine) {
                        body = (
                            <div className="flex items-center gap-2 px-3.5 py-2.5 rounded-2xl rounded-br-md border border-pink-500/40 bg-pink-500/10 text-pink-300 text-xs font-bold">
                                <span className="w-3 h-3 rounded-sm bg-pink-500"></span> Snap {msg.snap.emoji} • Delivered
                            </div>
                        );
                    } else if (msg.opened) {
                        body = (
                            <div className="flex items-center gap-2 px-3.5 py-2.5 rounded-2xl rounded-bl-md border border-slate-800 bg-[#141b2b] text-slate-500 text-xs font-bold">
                                <span className="w-3 h-3 rounded-sm border-2 border-pink-500/60"></span> Opened
                            </div>
                        );
                    } else {
                        body = (
                            <button onClick={(e) => { e.stopPropagation(); setSnapView(msg); updateMsg(msg.id, x => ({ ...x, opened: true })); }}
                                className="flex items-center gap-2 px-3.5 py-2.5 rounded-2xl rounded-bl-md bg-pink-500 text-white text-xs font-black shadow-lg shadow-pink-500/30 animate-pulse">
                                <span className="w-3 h-3 rounded-sm bg-white"></span> New Snap • Tap to view
                            </button>
                        );
                    }
                } else if (msg.type === 'poll') {
                    const total = msg.poll.options.reduce((s, o) => s + o.votes.length, 0) || 1;
                    body = (
                        <div className="w-64 rounded-2xl border border-slate-800 bg-[#0b111d] p-3.5">
                            <p className="text-[9px] uppercase font-black tracking-widest text-amber-400">📊 Poll</p>
                            <p className="text-sm font-black text-white mt-1 mb-2.5">{msg.poll.q}</p>
                            <div className="space-y-1.5">
                                {msg.poll.options.map((o, idx) => {
                                    const mineVote = o.votes.includes(ME);
                                    const pct = Math.round((o.votes.length / total) * 100);
                                    return (
                                        <button key={idx} onClick={(e) => { e.stopPropagation(); vote(msg.id, idx); }}
                                            className={`relative w-full text-left rounded-xl border overflow-hidden px-3 py-2 text-xs font-bold transition ${mineVote ? 'border-amber-400/60' : 'border-slate-800 hover:border-slate-600'}`}>
                                            <div className="absolute inset-y-0 left-0 bg-amber-400/15 transition-all duration-500" style={{ width: `${pct}%` }}></div>
                                            <div className="relative flex justify-between items-center">
                                                <span className="text-slate-200">{mineVote ? '✓ ' : ''}{o.label}</span>
                                                <span className="flex items-center gap-1">
                                                    <span className="flex -space-x-1.5">{o.votes.map(v => <Avatar key={v} m={byId[v]} size={16} />)}</span>
                                                    <span className="text-slate-400 ml-1">{pct}%</span>
                                                </span>
                                            </div>
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    );
                } else if (msg.type === 'challenge') {
                    const ch = msg.challenge, players = joinedOf(msg);
                    body = (
                        <div className="w-64 rounded-2xl border border-emerald-500/30 bg-gradient-to-br from-emerald-950/60 to-[#0b111d] p-3.5">
                            <div className="flex justify-between items-center">
                                <p className="text-[9px] uppercase font-black tracking-widest text-emerald-400">🏁 Squad Challenge</p>
                                <span className="text-[9px] font-black text-amber-300 bg-amber-400/10 border border-amber-400/30 rounded-md px-1.5 py-0.5">±{STAKE} pts</span>
                            </div>
                            <p className="text-sm font-black text-white mt-1">{ch.icon} {ch.title}</p>
                            {msg.result ? (msg.result.none
                                ? <p className="text-[11px] text-slate-500 font-bold mt-2">Closed: nobody took it</p>
                                : <><p className="text-[11px] font-black text-emerald-300 mt-2">✅ {msg.result.finished.length} finished · ❌ {msg.result.failed.length} didn’t</p>{Object.keys(msg.result.delta).length ? deltaRow(msg.result.delta) : <p className="text-[10px] text-slate-500 font-bold mt-1">No points moved</p>}</>)
                                : (
                                <>
                                    <div className="flex items-center justify-between mt-3">
                                        <div className="flex items-center gap-2">
                                            <div className="flex -space-x-2">{players.map(v => <div key={v} className="animate-pop"><Avatar m={byId[v]} size={24} /></div>)}</div>
                                            <span className="text-[10px] font-black font-mono text-slate-400">{fmtClock(leftSec(ch.endsAt))}</span>
                                        </div>
                                        {joinControl(msg)}
                                    </div>
                                    <p className="text-[9px] text-slate-500 font-medium mt-2">{players.length < 2 && ch.acceptBy ? `Needs someone to accept within ${fmtClock(leftSec(ch.acceptBy))}, or it’s gone.` : `React to join. Settles tonight: miss it −${STAKE}, finishers split it.`}</p>
                                </>
                            )}
                        </div>
                    );
                } else if (msg.type === 'phonedown') {
                    const pd = msg.phonedown, players = joinedOf(msg);
                    const shown = (Math.max(0, pd.startsAt + pd.dur - now.getTime()) / pd.dur) * pd.mins * 60;
                    body = (
                        <div className="w-64 rounded-2xl border border-fuchsia-500/30 bg-gradient-to-br from-fuchsia-950/50 to-[#0b111d] p-3.5">
                            <div className="flex justify-between items-center">
                                <p className="text-[9px] uppercase font-black tracking-widest text-fuchsia-300">📵 Phone Down</p>
                                <span className="text-[9px] font-black text-amber-300 bg-amber-400/10 border border-amber-400/30 rounded-md px-1.5 py-0.5">±{STAKE} pts</span>
                            </div>
                            <p className="text-sm font-black text-white mt-1">{pd.mins}-minute group lock</p>
                            {!msg.result && <p className="text-3xl font-black font-mono text-fuchsia-200 mt-1">{fmtClock(shown)}</p>}
                            <div className="flex flex-wrap gap-1.5 mt-2">
                                {players.map(p => <span key={p} className="flex items-center gap-1 text-[10px] font-bold text-slate-300 bg-black/30 rounded-full pl-0.5 pr-2 py-0.5"><Avatar m={byId[p]} size={16} />{msg.result?.loser === p ? '❌' : '🔒'}</span>)}
                            </div>
                            {msg.result ? (msg.result.loser
                                ? <><p className="text-[11px] font-black text-rose-300 mt-2">{nameOf(msg.result.loser)} picked up first</p>{deltaRow(msg.result.delta)}</>
                                : <p className="text-[11px] font-black text-emerald-300 mt-2">Everyone held strong 💪</p>)
                                : (
                                <div className="flex justify-between items-center mt-3">
                                    <span className="text-[9px] text-slate-500 font-medium">First to pick up loses</span>
                                    {players.includes(ME)
                                        ? <button onClick={(e) => { e.stopPropagation(); pickUp(msg.id, ME); }} className="text-[10px] font-black text-rose-300 border border-rose-500/40 bg-rose-500/10 px-2.5 py-1.5 rounded-lg">I picked up 😬</button>
                                        : joinControl(msg)}
                                </div>
                            )}
                        </div>
                    );
                }

                return (
                    <div key={msg.id} className={`flex gap-2 animate-fadeIn ${mine ? 'justify-end' : 'justify-start'} ${grouped ? '-mt-1.5' : ''}`}>
                        {!mine && <div className="w-7 shrink-0 self-end">{!grouped && <Avatar m={m} size={28} />}</div>}
                        <div className={`max-w-[80%] flex flex-col ${mine ? 'items-end' : 'items-start'}`}>
                            {!mine && !grouped && <span className="text-[10px] font-black mb-1 ml-1" style={{ color: m.color }}>{m.name} <span className="text-slate-600 font-medium">{msg.time}</span></span>}
                            <div className="relative cursor-pointer" onClick={() => setPicker(picker === msg.id ? null : msg.id)}>
                                {body}
                                {picker === msg.id && (
                                    <div className={`absolute z-20 -top-11 ${mine ? 'right-0' : 'left-0'} flex gap-1 bg-[#141b2b] border border-slate-700 rounded-full px-2 py-1.5 shadow-2xl animate-pop`}>
