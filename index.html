                                                <p className="text-[10px] font-bold text-slate-500">Low {bio.spo2.min}% overnight</p>
                                            </div>
                                            <div className="bg-[#060911] rounded-2xl border border-slate-800/70 p-3">
                                                <span className="text-[10px] text-slate-400 uppercase font-black">Skin temp</span>
                                                <p className={`text-xl font-black mt-0.5 ${bio.skinTemp.delta >= 0.5 ? 'text-amber-300' : 'text-white'}`}>{bio.skinTemp.delta > 0 ? '+' : ''}{bio.skinTemp.delta.toFixed(1)}°C</p>
                                                <p className="text-[10px] font-bold text-slate-500">vs your baseline</p>
                                            </div>
                                        </div>
                                        {bio.skinTemp.delta >= 0.5 && (
                                            <div className="mt-3 rounded-2xl border border-amber-500/30 bg-amber-500/10 px-3.5 py-2.5 text-[11px] font-bold text-amber-200">
                                                🤒 Skin temp is up {bio.skinTemp.delta.toFixed(1)}°C. You might be getting sick, so take it easy today.
                                            </div>
                                        )}
                                    </>
                                )}
                            </Card>

                            {/* Stress */}
                            {extras.stress && (() => {
                                const st = bio.stress;
                                const lvl = (v) => (v < 26 ? '#34d399' : v < 51 ? '#fbbf24' : v < 76 ? '#fb923c' : '#f43f5e');
                                return (
                                    <Card label="Stress">
                                        <div className="flex items-end justify-between">
                                            <div>
                                                <span className="text-[10px] text-slate-400 uppercase font-black">Average today</span>
                                                <p className="text-3xl font-black mt-1" style={{ color: lvl(st.avg) }}>{st.avg}<span className="text-xs text-slate-500 font-semibold ml-1">/100</span></p>
                                                <p className="text-[10px] font-bold text-slate-500">{st.avg < 26 ? 'Low' : st.avg < 51 ? 'Medium' : 'High'} stress</p>
                                            </div>
                                        </div>
                                        <div className="flex items-end gap-1 h-16 mt-4">
                                            {st.timeline.map((v, i) => <div key={i} className="flex-1 rounded-t-md" style={{ height: `${Math.max(8, v)}%`, background: lvl(v) }}></div>)}
                                        </div>
                                        <div className="flex justify-between text-[9px] font-bold text-slate-600 mt-1"><span>6 AM</span><span>12 PM</span><span>Now</span></div>
                                        <div className="mt-4 flex items-center justify-between rounded-2xl bg-[#060911] border border-slate-800/70 px-3 py-2.5">
                                            <div className="flex items-center gap-2.5">
                                                <Avatar m={chillest} size={28} />
                                                <div>
                                                    <p className="text-[9px] uppercase font-black text-emerald-400">🧘 Most chill in squad</p>
                                                    <p className="text-xs font-black text-slate-200">{nameOf(chillest.id)} · avg {chillest.stress}</p>
                                                </div>
                                            </div>
                                            <span className="text-lg">🏅</span>
                                        </div>
                                    </Card>
                                );
                            })()}

                            {/* Screen Time */}
                            {extras.screen && (() => {
                                const s = bio.screen;
                                const over = s.total > s.limit;
                                const col = over ? '#f43f5e' : s.total > s.limit * 0.8 ? '#fbbf24' : '#34d399';
                                const diff = s.total - s.yesterday;
                                return (
                                    <Card label="Screen Time" right={<Source device={src} field="screen" />}>
                                        <div className="flex items-center justify-between">
                                            <div>
                                                <span className="text-[10px] text-slate-400 uppercase font-black">Today</span>
                                                <p className="text-3xl font-black text-white mt-1">{fmtHM(s.total)}</p>
                                                <p className={`text-[10px] font-bold mt-0.5 ${diff <= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                                                    {diff <= 0 ? '▼' : '▲'} {fmtHM(Math.abs(diff))} vs yesterday
                                                </p>
                                            </div>
                                            <Ring value={s.total} max={s.limit} size={84} stroke={8} color={col}>
                                                <span className="text-lg font-black" style={{ color: col }}>{Math.round((s.total / s.limit) * 100)}%</span>
                                                <span className="text-[8px] uppercase font-black text-slate-500">of {s.limit / 60}h limit</span>
                                            </Ring>
                                        </div>
                                        <div className="mt-4 rounded-2xl border border-indigo-500/30 bg-indigo-500/5 p-3.5">
                                            <div className="flex justify-between items-start">
                                                <div>
                                                    <p className="text-[9px] uppercase font-black tracking-widest text-indigo-300">🌙 Screen curfew · {settings.curfew}</p>
                                                    <p className="text-sm font-black text-white mt-0.5">{SQUAD_EXTRA[ME].curfewStreak}-night streak 🔥</p>
                                                </div>
                                                <span className="text-[10px] font-bold text-slate-500">Last night</span>
                                            </div>
                                            <div className="flex gap-2 mt-3">
                                                {squad.map(m => (
                                                    <div key={m.id} className="flex flex-col items-center gap-1 flex-1">
                                                        <div className="relative"><Avatar m={m} size={30} /><span className="absolute -bottom-1 -right-1 text-[11px]">{SQUAD_EXTRA[m.id].curfewLast ? '✅' : '❌'}</span></div>
                                                        <span className="text-[9px] font-bold text-slate-400">{nameOf(m.id)}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                        <button onClick={() => { if (startPhoneDown() !== false) setTab('chat'); }} className="w-full mt-3 py-3 rounded-2xl bg-fuchsia-500/15 border border-fuchsia-500/40 text-fuchsia-200 font-black text-sm">📵 Start a {settings.phoneDownMins}-min Phone Down</button>
                                        <p className="text-[9px] text-slate-500 font-medium mt-2 text-center">🔒 Only you see your minutes. The squad only sees pass / fail.</p>
                                    </Card>
                                );
                            })()}

                            {/* VO2 max */}
                            {extras.vo2 && (() => {
                                const v = bio.vo2, w = 200, h = 40, mn = Math.min(...v.trend), mx = Math.max(...v.trend);
                                const pts = v.trend.map((x, i) => `${(i * w) / (v.trend.length - 1)},${h - ((x - mn) / (mx - mn || 1)) * (h - 6) - 3}`).join(' ');
                                const order = [...squad].sort((a, b) => SQUAD_EXTRA[b.id].vo2 - SQUAD_EXTRA[a.id].vo2);
                                const top = SQUAD_EXTRA[order[0].id].vo2;
                                return (
                                    <Card label="VO₂ Max">
                                        <div className="flex items-center justify-between">
                                            <div>
                                                <p className="text-3xl font-black text-sky-300">{v.value}<span className="text-xs text-slate-500 font-semibold ml-1">ml/kg/min</span></p>
                                                <p className="text-[10px] font-bold text-emerald-400 mt-0.5">▲ {(v.value - v.trend[0]).toFixed(1)} in 6 weeks</p>
                                            </div>
                                            <svg viewBox={`0 0 ${w} ${h}`} className="w-28 h-10"><polyline points={pts} fill="none" stroke="#7dd3fc" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" /></svg>
                                        </div>
                                        <div className="space-y-2 mt-4">
                                            {order.map((m, i) => (
                                                <div key={m.id} className="flex items-center gap-2.5">
                                                    <span className={`w-4 text-[10px] font-black ${i === 0 ? 'text-amber-400' : 'text-slate-500'}`}>{i + 1}</span>
                                                    <Avatar m={m} size={22} />
                                                    <div className="flex-1"><Bar pct={(SQUAD_EXTRA[m.id].vo2 / top) * 100} color={m.color} /></div>
                                                    <span className="w-9 text-right text-[11px] font-black text-slate-200">{SQUAD_EXTRA[m.id].vo2}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </Card>
                                );
                            })()}
                        </main>
                    )}

                    {/* ================= MONTH CHALLENGE ================= */}
                    {tab === 'leaderboard' && (
                        <main className="flex-1 min-h-0 flex flex-col overflow-y-auto pb-24 animate-fadeIn">
                            <div className="flex items-center justify-between gap-3 px-5 pt-4 pb-2">
                                <div>
                                    <p className="text-[10px] uppercase font-black tracking-[0.2em] text-slate-500">Day {CHALLENGE_DAY} of {MONTH_DAYS}</p>
                                    <p className="text-sm font-black text-white mt-0.5">{me.challengeScore.toLocaleString()}<span className="text-slate-500 font-bold"> / {(CHALLENGE_DAY * DAILY_MAX).toLocaleString()} possible</span></p>
                                </div>
                                <div className="flex rounded-xl bg-[#0b111d] p-1 border border-slate-800">
                                    {[['12h', '12H'], ['full', 'FULL']].map(([key, label]) => <button key={key} onClick={() => setChallengeZoom(key)} className={`min-w-12 px-2.5 py-1.5 rounded-lg text-[10px] font-black transition ${challengeZoom === key ? 'bg-[#c8ff00] text-black shadow-[0_0_16px_rgba(200,255,0,0.25)]' : 'text-slate-500 hover:text-slate-300'}`}>{label}</button>)}
                                </div>
                            </div>
                            {challengeZoom === 'full' && <div className="flex justify-end px-5 pb-2"><div className="flex rounded-xl bg-[#0b111d] p-1 border border-slate-800">{Object.entries(CHALLENGE_RANGES).map(([key, range]) => <button key={key} onClick={() => setChallengeRange(key)} className={`min-w-10 px-2.5 py-1.5 rounded-lg text-[10px] font-black transition ${challengeRange === key ? 'bg-slate-700 text-white' : 'text-slate-500 hover:text-slate-300'}`}>{range.label}</button>)}</div></div>}
                            <div className="flex-1 min-h-0 px-2 pb-1">
                                <MonthlyChallengeChart players={activeChartSquad} pointLabel={chartPointLabel} labelForIndex={chartLabelForIndex} maxPossible={challengeZoom === '12h' ? null : chartSquad[0].chartEntries.length * (challengeRange === '3m' ? DAILY_MAX * 7 : DAILY_MAX)} />
                            </div>
                        </main>
                    )}

                    {/* ================= GROUP FEED ================= */}
                    {tab === 'chat' && (
                        <main className="flex-1 flex flex-col overflow-hidden pb-[96px] animate-fadeIn" onClick={() => setPicker(null)}>

                            {/* Story bar */}
                            <div className="flex gap-4 px-4 pt-3 pb-3 border-b border-slate-800/60 overflow-x-auto no-scrollbar">
                                {squad.map(m => {
                                    const c = m.recovery >= 67 ? '#34d399' : m.recovery >= 34 ? '#fbbf24' : '#f43f5e';
                                    return (
                                        <button key={m.id} onClick={(e) => { e.stopPropagation(); setProfile(m); }} className="flex flex-col items-center shrink-0">
                                            <div className="rounded-full p-[2.5px]" style={{ background: `conic-gradient(${c} ${m.recovery}%, #1e293b 0)` }}>
                                                <div className="rounded-full p-[2px] bg-[#05070a]"><Avatar m={m} size={46} /></div>
                                            </div>
                                            <span className="text-[10px] font-bold text-slate-300 mt-1">{m.id === ME ? 'You' : m.name}</span>
                                            <span className="text-[9px] font-black" style={{ color: c }}>{m.recovery}%</span>
                                        </button>
                                    );
                                })}
                                <button onClick={(e) => { e.stopPropagation(); setPage('profile'); }} className="ml-auto flex flex-col items-center shrink-0" aria-label="Settings">
                                    <div className="w-[54px] h-[54px] rounded-full border-2 border-dashed border-slate-700 flex items-center justify-center text-xl">⚙️</div>
                                    <span className="text-[10px] font-bold text-slate-400 mt-1">Settings</span>
                                </button>
                            </div>

                            {/* Messages */}
                            <div className="flex-1 overflow-y-auto px-3 py-4 space-y-3">
                                <div className="flex justify-center"><span className="text-[9px] font-black uppercase tracking-widest text-slate-600">Today</span></div>
                                {messages.map(renderMessage)}
                                {typing && (
                                    <div className="flex gap-2 items-end animate-fadeIn">
                                        <Avatar m={byId[typing]} size={28} />
                                        <div className="bg-[#141b2b] border border-slate-800 rounded-2xl rounded-bl-md px-3.5 py-3 flex gap-1">
                                            <span className="dot w-1.5 h-1.5 rounded-full bg-slate-400"></span>
                                            <span className="dot w-1.5 h-1.5 rounded-full bg-slate-400"></span>
                                            <span className="dot w-1.5 h-1.5 rounded-full bg-slate-400"></span>
                                        </div>
                                    </div>
                                )}
                                <div ref={chatEndRef}></div>
                            </div>

                            {/* Quick chips */}
                            <div className="flex gap-2 px-3 pb-2 overflow-x-auto no-scrollbar">
                                {QUICK.map(q => (
                                    <button key={q} onClick={() => sendText(q)} className="shrink-0 text-[11px] font-bold px-3 py-1.5 rounded-full bg-slate-900 border border-slate-800 text-slate-300 hover:border-cyan-500/50 hover:text-cyan-300 transition">{q}</button>
                                ))}
                            </div>

                            {/* Composer */}
                            <form onSubmit={(e) => { e.preventDefault(); sendText(input); }} className="flex items-center gap-2 px-3 pb-2">
                                <button type="button" onClick={(e) => { e.stopPropagation(); setSheet('menu'); }} aria-label="More actions"
                                    className="w-11 h-11 shrink-0 rounded-2xl bg-slate-900 border border-slate-800 text-cyan-400 text-xl font-black hover:border-cyan-500/50 transition">+</button>
                                <input value={input} onChange={(e) => setInput(e.target.value)} placeholder="Message the squad…"
                                    className="flex-1 min-w-0 bg-[#0b111d] border border-slate-800 rounded-2xl px-4 py-3 text-[13px] text-slate-200 focus:outline-none focus:border-cyan-400 transition select-text" />
                                <button type="submit" disabled={!input.trim()} aria-label="Send"
                                    className="w-11 h-11 shrink-0 rounded-2xl bg-cyan-400 disabled:bg-slate-800 disabled:text-slate-600 text-black font-black flex items-center justify-center transition">
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" strokeLinecap="round" strokeLinejoin="round" /></svg>
                                </button>
                            </form>
                        </main>
                    )}

                    {/* ================= MAPS ================= */}
                    {tab === 'map' && (() => {
                        const run = map.run, runRoute = run && routeOf(map, run.routeId);
                        const counts = squad.map(m => ({ ...byId[m.id], count: hexCount(map.hexes, m.id) })).sort((a, b) => b.count - a.count);
                        const totalHex = HEX_GRID.length;
                        const myCount = hexCount(map.hexes, ME);
                        const highlight = run ? run.routeId : mapMode === 'routes' ? selRoute : null;
                        const myPos = posOf(map, ME);
                        const colors = Object.fromEntries(squad.map(m => [m.id, m.color]));
                        const pins = squad.map(m => {
                            const [x, y] = posOf(map, m.id);
                            const hidden = m.id === ME && !shareLocation;
                            return { key: String(m.id), x, y, color: m.color, img: avatarUrl(m), moving: isMoving(map, m.id), me: m.id === ME, hidden, label: m.id === ME ? (hidden ? 'Hidden' : 'You') : null };
                        });
                        let ghostGap = null, king = null;
                        if (run) {
                            king = runRoute.record.userId;
                            const gT = Math.min(1, (run.t * run.target) / runRoute.record.time);
                            const [gx, gy] = pointAt(runRoute.pts, gT);
                            pins.push({ key: 'ghost', x: gx, y: gy, color: byId[king].color, img: avatarUrl(byId[king]), ghost: true });
                            ghostGap = Math.round((run.t - gT) * runRoute.km * 1000);
                        }
                        const glass = 'bg-black/60 backdrop-blur-md border border-white/10';
                        return (
                            <main className="flex-1 flex flex-col overflow-hidden pb-[88px] animate-fadeIn">
                                {/* Map */}
                                <div className={`relative ${run ? 'h-[72%]' : 'h-[58%]'} min-h-[300px] shrink-0 overflow-hidden transition-[height] duration-500`}>
                                    <SquadMap center={center} hexes={map.hexes} routes={map.routes} run={run} trails={map.trails} rally={map.rally}
                                        colors={colors} pins={pins} mode={mapMode} highlight={highlight}
                                        follow={run && follow ? myPos : null} focus={focus}
                                        onMapClick={rallyArm ? placeRally : null} />

                                    <div className={`absolute top-3 left-3 right-16 z-[1000] flex rounded-2xl p-1 ${glass}`}>
                                        {[['live', 'Live'], ['routes', 'Routes'], ['territory', 'Territory']].map(([k, l]) => (
                                            <button key={k} onClick={() => setMapMode(k)} className={`flex-1 py-1.5 rounded-xl text-[11px] font-black transition ${mapMode === k ? 'bg-[#c8ff00] text-black' : 'text-slate-300'}`}>{l}</button>
                                        ))}
                                    </div>
                                    <div className="absolute top-3 right-3 z-[1000] flex flex-col gap-2">
                                        <button onClick={useMyLocation} title="Use my location" aria-label="Use my location" className={`w-10 h-10 rounded-xl text-base ${glass}`}>📍</button>
                                        <button onClick={() => setFocus({ x: myPos[0], y: myPos[1], key: Date.now() })} title="Find me" aria-label="Find me" className={`w-10 h-10 rounded-xl text-base ${glass}`}>🎯</button>
                                        <button onClick={() => setFocus({ x: MAP_W / 2, y: MAP_H / 2, zoom: 14, key: Date.now() })} title="Show whole area" aria-label="Show whole area" className={`w-10 h-10 rounded-xl text-base ${glass}`}>🗺️</button>
                                    </div>
                                    {mapMode === 'territory' && !run && (
                                        <div className={`absolute bottom-3 left-3 right-3 z-[1000] rounded-2xl p-2.5 ${glass}`}>
                                            <div className="flex h-2.5 rounded-full overflow-hidden gap-0.5 bg-slate-800">
                                                {counts.filter(c => c.count).map(c => <div key={c.id} style={{ width: `${(c.count / totalHex) * 100}%`, background: c.color, transition: 'width .5s' }}></div>)}
                                            </div>
                                            <p className="text-[10px] font-bold text-slate-300 mt-1.5">You hold <b className="text-[#c8ff00]">{myCount}</b> of {totalHex} hexes · {Math.round((myCount / totalHex) * 100)}% of the map</p>
                                        </div>
                                    )}
                                    {run && (
                                        <div className="absolute bottom-3 left-3 right-3 z-[1000] rounded-2xl bg-black/75 backdrop-blur-md border border-[#c8ff00]/40 p-3 animate-fadeIn">
                                            <div className="flex justify-between items-center">
                                                <span className="text-[9px] uppercase font-black tracking-[0.2em] text-[#c8ff00] flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-rose-500 animate-pulse"></span>Live · {runRoute.name}</span>
                                                <button onClick={() => setFollow(f => !f)} className={`text-[9px] font-black px-2 py-0.5 rounded-md ${follow ? 'bg-[#c8ff00]/20 text-[#c8ff00]' : 'text-slate-400'}`}>{follow ? 'Following' : 'Follow me'}</button>
                                            </div>
                                            <div className="grid grid-cols-4 gap-1 mt-2 text-center">
                                                {[['Time', fmtClock(run.t * run.target)], ['Km', (run.t * runRoute.km).toFixed(2)], ['Pace', fmtPace(run.target / runRoute.km).replace('/km', '')], ['Hexes', `+${run.captured || 0}`]].map(([l, v]) => (
                                                    <div key={l}><p className="text-lg font-black font-mono text-white leading-tight">{v}</p><p className="text-[8px] uppercase font-black text-slate-500">{l}</p></div>
                                                ))}
                                            </div>
                                            <div className="flex items-center justify-between mt-2 text-[10px] font-black">
                                                <span className="flex items-center gap-1.5 text-slate-300"><Avatar m={byId[king]} size={16} />👻 {king === ME ? 'Your record' : `${byId[king].name}’s record`}</span>
                                                <span className={ghostGap >= 0 ? 'text-emerald-400' : 'text-rose-400'}>{ghostGap >= 0 ? `${ghostGap} m ahead` : `${-ghostGap} m behind`}</span>
                                            </div>
                                            <div className="mt-2"><Bar pct={run.t * 100} color="#c8ff00" /></div>
                                        </div>
                                    )}
                                    {rallyArm && <div className="absolute bottom-3 left-1/2 -translate-x-1/2 z-[1000] px-3 py-2 rounded-full bg-[#c8ff00] text-black text-[11px] font-black shadow-xl animate-pop">Tap the map to drop your rally point</div>}
                                    {geoNote && <div className={`absolute top-16 left-3 z-[1000] px-3 py-1.5 rounded-full text-[10px] font-bold text-slate-200 ${glass}`}>{geoNote}</div>}
                                </div>

                                {/* Panel */}
                                <div className="flex-1 overflow-y-auto p-4 space-y-3">
                                    {mapMode === 'live' && (
                                        <>
                                            <div className="grid grid-cols-2 gap-2">
                                                <button onClick={() => setRallyArm(a => !a)} className={`py-2.5 rounded-xl text-xs font-black border transition ${rallyArm ? 'bg-[#c8ff00] text-black border-[#c8ff00]' : 'bg-[#0e1422] border-slate-800 text-slate-200'}`}>📍 {rallyArm ? 'Tap the map…' : 'Drop rally point'}</button>
                                                <button onClick={() => setShareLocation(v => !v)} className={`py-2.5 rounded-xl text-xs font-black border transition ${shareLocation ? 'bg-[#0e1422] border-slate-800 text-slate-200' : 'bg-slate-800 border-slate-600 text-slate-300'}`}>{shareLocation ? '👁 Sharing location' : '🙈 Location hidden'}</button>
                                            </div>
                                            {squad.map(m => {
                                                const moving = isMoving(map, m.id);
                                                const rName = m.id === ME ? runRoute?.name : map.live[m.id].route && routeOf(map, map.live[m.id].route).name;
                                                const [x, y] = posOf(map, m.id);
                                                const d = Math.hypot(x - myPos[0], y - myPos[1]) * KM_PER_PX;
                                                return (
                                                    <button key={m.id} onClick={() => setFocus({ x, y, key: Date.now() })} className="w-full flex items-center justify-between rounded-2xl px-3 py-2.5 bg-[#0e1422] border border-slate-800/70 text-left">
                                                        <div className="flex items-center gap-3">
                                                            <Avatar m={m} size={34} />
                                                            <div>
                                                                <p className="text-xs font-black text-slate-200">{nameOf(m.id)}</p>
                                                                <p className="text-[10px] font-bold" style={{ color: moving ? m.color : '#64748b' }}>{m.id === ME && !shareLocation ? 'Hidden from squad' : moving ? `Running · ${rName}` : 'Resting'}</p>
                                                            </div>
                                                        </div>
                                                        <div className="text-right">
                                                            <p className="text-[11px] font-black" style={{ color: m.color }}>{hexCount(map.hexes, m.id)} hexes</p>
                                                            <p className="text-[9px] font-bold text-slate-500">{m.id === ME ? 'You' : `${d.toFixed(1)} km away`}</p>
                                                        </div>
                                                    </button>
                                                );
                                            })}
                                        </>
                                    )}

                                    {mapMode === 'routes' && run && (
                                        <section className="rounded-[22px] border border-[#c8ff00]/30 bg-[#0e1422] p-4">
                                            <p className="text-sm font-black text-white">Running {runRoute.name}</p>
                                            <p className="text-[11px] text-slate-400 font-medium mt-1">Every hex you pass turns your colour. Beat the 👻 ghost to take the crown.</p>
                                            <button onClick={stopRun} className="w-full mt-3 py-3 rounded-xl bg-rose-500/15 border border-rose-500/40 text-rose-300 font-black text-sm">End run</button>
                                        </section>
                                    )}

                                    {mapMode === 'routes' && !run && map.routes.map(r => {
                                        const sel = r.id === selRoute, kg = byId[r.record.userId];
                                        return (
                                            <div key={r.id} onClick={() => setSelRoute(r.id)} className={`cursor-pointer rounded-[22px] p-4 border transition ${sel ? 'bg-[#c8ff00]/5 border-[#c8ff00]/40' : 'bg-[#0e1422] border-slate-800/80'}`}>
                                                <div className="flex justify-between items-start gap-3">
                                                    <div>
                                                        <p className="text-sm font-black text-white">{r.name}</p>
                                                        <p className="text-[10px] font-bold text-slate-500 mt-0.5">{r.km} km · {r.elev} m climb</p>
                                                    </div>
                                                    <div className="flex items-center gap-2 text-right">
                                                        <div><p className="text-[9px] uppercase font-black text-amber-400">👑 King</p><p className="text-[11px] font-black text-slate-200">{nameOf(kg.id)} · {fmtClock(r.record.time)}</p></div>
                                                        <Avatar m={kg} size={28} />
                                                    </div>
                                                </div>
                                                {sel && (
                                                    <div className="mt-3 pt-3 border-t border-slate-800/80 flex items-center justify-between animate-fadeIn">
                                                        <span className="text-[10px] font-bold text-slate-400">Your best <b className="text-[#c8ff00] ml-1">{fmtClock(r.best)}</b></span>
                                                        <button onClick={(e) => { e.stopPropagation(); startRun(r.id); }} className="px-4 py-2 rounded-xl bg-[#c8ff00] text-black text-xs font-black">▶ Race the ghost</button>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}

                                    {mapMode === 'territory' && (
                                        <section className="bg-[#0e1422] border border-slate-800/80 rounded-[22px] p-4">
                                            <p className="text-sm font-black text-white">Territory</p>
                                            <p className="text-[10px] text-slate-500 font-medium mt-0.5">Run through hexes to paint them your colour. Anyone can steal them back.</p>
                                            <div className="space-y-2 mt-3">
                                                {counts.map((c, i) => (
                                                    <div key={c.id} className="flex items-center gap-2.5">
                                                        <span className={`w-4 text-[10px] font-black ${i === 0 ? 'text-amber-400' : 'text-slate-500'}`}>{i + 1}</span>
                                                        <Avatar m={c} size={26} />
                                                        <div className="flex-1"><Bar pct={(c.count / Math.max(1, counts[0].count)) * 100} color={c.color} /></div>
                                                        <span className="w-14 text-right text-[11px] font-black" style={{ color: c.color }}>{c.count} hex</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </section>
                                    )}
                                </div>
                            </main>
                        );
                    })()}

                    {/* ---------- Bottom sheets & overlays ---------- */}
                    {(sheet || profile) && (
                        <div className="absolute inset-0 z-40 bg-black/60 backdrop-blur-sm flex items-end" onClick={() => { setSheet(null); setProfile(null); }}>
                            <div className="w-full bg-[#0b111d] border-t border-slate-800 rounded-t-[28px] p-5 pb-8 animate-slideUp" onClick={(e) => e.stopPropagation()}>
                                <div className="w-10 h-1 bg-slate-700 rounded-full mx-auto mb-4"></div>

                                {sheet === 'menu' && (
                                    <div className="grid grid-cols-2 gap-3">
                                        {[
                                            ['📊', 'Share my stats', 'Recovery, strain & steps card', shareStats],
                                            ['📸', 'Send a snap', 'View once, then it’s gone', () => setSheet('snap')],
                                            ['🗳️', 'Start a poll', 'Let the squad decide', () => setSheet('poll')],
                                            ['🏁', 'Squad challenge', 'React to join · ±2 pts tonight', () => setSheet('challenge')],
                                            ['⚔️', '1v1 duel', 'Winner +2, loser −2', () => setSheet('duel')],
                                            ['📵', 'Phone Down', 'First to pick up: −2', startPhoneDown],
                                        ].map(([i, t, d, fn]) => (
                                            <button key={t} onClick={fn} className="text-left p-4 rounded-2xl bg-[#0e1422] border border-slate-800 hover:border-cyan-500/40 transition">
                                                <span className="text-2xl">{i}</span>
                                                <p className="text-sm font-black text-white mt-2">{t}</p>
                                                <p className="text-[10px] text-slate-500 font-medium">{d}</p>
                                            </button>
                                        ))}
                                    </div>
                                )}

                                {sheet === 'snap' && (
                                    <>
                                        <p className="text-sm font-black text-white mb-3">Pick your snap</p>
                                        <div className="grid grid-cols-2 gap-3">
                                            {SNAP_PRESETS.map(p => (
                                                <button key={p.caption} onClick={() => sendSnap(p)} className="h-28 rounded-2xl flex flex-col items-center justify-center text-white font-black text-xs" style={{ background: p.bg }}>
                                                    <span className="text-4xl mb-1">{p.emoji}</span>{p.caption}
                                                </button>
                                            ))}
                                        </div>
                                    </>
                                )}

                                {sheet === 'poll' && (
                                    <form onSubmit={(e) => { e.preventDefault(); sendPoll(); }} className="space-y-2.5">
                                        <p className="text-sm font-black text-white">New poll</p>
                                        <input autoFocus value={pollDraft.q} onChange={(e) => setPollDraft({ ...pollDraft, q: e.target.value })} placeholder="Ask the squad…"
                                            className="w-full bg-[#060911] border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-amber-400 select-text" />
                                        {['a', 'b'].map(k => (
                                            <input key={k} value={pollDraft[k]} onChange={(e) => setPollDraft({ ...pollDraft, [k]: e.target.value })}
                                                className="w-full bg-[#060911] border border-slate-800 rounded-xl px-3.5 py-2 text-xs focus:outline-none focus:border-amber-400 select-text" />
                                        ))}
                                        <button type="submit" disabled={!pollDraft.q.trim()} className="w-full bg-amber-400 disabled:opacity-40 text-black font-black py-3 rounded-xl text-sm">Post poll</button>
                                    </form>
                                )}

                                {sheet === 'challenge' && (
                                    <div className="space-y-3">
                                        <div>
                                            <p className="text-sm font-black text-white">Challenge the squad <span className="text-[10px] text-slate-500 font-bold ml-1">{sendsLeft}/{MAX_SENDS} left today</span></p>
                                            <p className="text-[10px] text-slate-500 font-medium mt-0.5">Anyone who reacts is in. At the end of the day, each player who didn’t finish loses {STAKE} pts and the finishers split them. Nobody else is affected.</p>
                                        </div>
                                        {metricPicker}
                                        <button onClick={sendChallenge} disabled={!sendsLeft} className="w-full disabled:opacity-40 bg-emerald-400 text-black font-black py-3 rounded-xl text-sm">Send challenge</button>
                                    </div>
                                )}

                                {sheet === 'duel' && (
                                    <div className="space-y-3">
                                        <div>
                                            <p className="text-sm font-black text-white">1v1 duel <span className="text-[10px] text-slate-500 font-bold ml-1">{sendsLeft}/{MAX_SENDS} left today</span></p>
                                            <p className="text-[10px] text-slate-500 font-medium mt-0.5">Winner +{STAKE}, loser −{STAKE} on today’s score. Nobody else is affected.</p>
                                        </div>
                                        <div className="flex gap-2">
                                            {others().map(o => (
                                                <button key={o.id} onClick={() => setDraft(d => ({ ...d, opp: o.id }))} className={`flex-1 flex flex-col items-center gap-1 py-2.5 rounded-xl border transition ${draft.opp === o.id ? 'border-rose-400/60 bg-rose-500/10' : 'border-slate-800 bg-[#0e1422]'}`}>
                                                    <Avatar m={byId[o.id]} size={32} />
                                                    <span className="text-[10px] font-black text-slate-300">{o.name}</span>
                                                </button>
                                            ))}
                                        </div>
                                        {metricPicker}
                                        <button onClick={startDuel} disabled={!sendsLeft} className="w-full disabled:opacity-40 bg-rose-500 text-white font-black py-3 rounded-xl text-sm">⚔️ Send duel</button>
                                    </div>
                                )}

                                {profile && !sheet && (() => {
                                    const m = byId[profile.id];
                                    const c = m.recovery >= 67 ? '#34d399' : m.recovery >= 34 ? '#fbbf24' : '#f43f5e';
                                    const r = ranked.findIndex(x => x.id === m.id) + 1;
                                    return (
                                        <div>
                                            <div className="flex items-center gap-4">
                                                <Avatar m={m} size={60} />
                                                <div>
                                                    <p className="text-lg font-black text-white">{m.id === ME ? 'You' : m.name}</p>
                                                    <p className="text-[11px] text-slate-400 font-medium">{ordinal(r)} this month · today {fmtPts(adj(m.id))}</p>
                                                </div>
                                            </div>
                                            <div className="grid grid-cols-3 gap-2 mt-4">
                                                {[['Recovery', `${m.recovery}%`, c], ['Challenge Score', m.challengeScore.toLocaleString(), '#22d3ee'], ['Today', `${m.dailyScores[CHALLENGE_DAY - 1]}/100`, '#a78bfa']].map(([l, v, col]) => (
                                                    <div key={l} className="bg-[#060911] border border-slate-800 rounded-xl p-2.5 text-center">
                                                        <p className="text-[9px] uppercase font-black text-slate-500">{l}</p>
                                                        <p className="text-base font-black" style={{ color: col }}>{v}</p>
                                                    </div>
                                                ))}
                                            </div>
                                            {m.id !== ME && (
                                                <div className="grid grid-cols-3 gap-2 mt-4">
                                                    <button onClick={() => openDuel(m.id)} className="py-3 rounded-xl bg-rose-500 text-white font-black text-sm">⚔️ Duel</button>
                                                    <button onClick={() => hype(m)} className="py-3 rounded-xl bg-orange-500 text-black font-black text-sm">🔥 Hype</button>
                                                    <button onClick={() => nudge(m)} className="py-3 rounded-xl bg-slate-800 text-slate-200 font-black text-sm">👉 Nudge</button>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })()}
                            </div>
                        </div>
                    )}

                    {/* ---------- Profile & Settings ---------- */}
                    {page === 'profile' && (
                        <div className="absolute inset-0 z-40 bg-[#05070a] flex flex-col animate-fadeIn">
                            <div className="flex items-center gap-3 px-4 py-3.5 border-b border-slate-800/60">
                                <button onClick={() => setPage(null)} className="w-9 h-9 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 text-xl leading-none" aria-label="Back">‹</button>
                                <h2 className="text-sm font-black text-white">Profile & Settings</h2>
                            </div>
                            <div className="flex-1 overflow-y-auto p-4 space-y-4 pb-10">
                                {/* Group selector (first): everything below follows the selected group */}
                                <section>
                                    <p className="text-[10px] font-black uppercase tracking-[0.2em] text-slate-500 mb-2 px-1">Your groups</p>
                                    <div className="grid grid-cols-2 gap-2">
                                        {GROUPS.map(g => (
                                            <button key={g.id} onClick={() => setGroup(g.id)} className={`relative flex flex-col items-start gap-1.5 rounded-2xl p-3 border text-left transition ${group === g.id ? 'bg-[#c8ff00]/10 border-[#c8ff00]/60' : 'bg-[#0e1422] border-slate-800'}`}>
                                                <span className="w-9 h-9 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center text-lg">{g.emoji}</span>
                                                <p className="text-[13px] font-black text-white leading-tight">{g.name}</p>
                                                <p className="text-[10px] font-bold text-slate-500">{g.size} members</p>
                                                {group === g.id && <span className="absolute top-2.5 right-2.5 w-4 h-4 rounded-full bg-[#c8ff00] text-black text-[10px] font-black flex items-center justify-center">✓</span>}
                                            </button>
                                        ))}
                                    </div>
                                </section>

                                {/* Me */}
                                <section className="rounded-[24px] bg-gradient-to-br from-[#141b2b] to-[#0b111d] border border-slate-800 p-4">
                                    <div className="flex items-center gap-4">
                                        <Avatar m={me} size={56} />
                                        <div className="flex-1">
                                            <p className="text-lg font-black text-white">{me.name}</p>
                                            <p className="text-[10px] font-bold text-slate-500">{groupObj.emoji} {groupObj.name} · {SOURCES[device].name}</p>
                                        </div>
                                        <div className="text-right"><p className="text-2xl font-black text-[#c8ff00]">{gp.challenge.toLocaleString()}</p><p className="text-[9px] uppercase font-black text-slate-500">Challenge pts</p></div>
                                    </div>
                                    <div className="grid grid-cols-3 gap-2 mt-4">
                                        {[['Rank', `#${gp.rank} of ${gp.size}`], ['Today', `${gp.today}/100`], ['Badges', `${badges.filter(b => b.earned).length}/${badges.length}`]].map(([l, v]) => (
                                            <div key={l} className="bg-black/30 rounded-xl border border-slate-800 p-2 text-center"><p className="text-[9px] uppercase font-black text-slate-500">{l}</p><p className="text-sm font-black text-white">{v}</p></div>
                                        ))}
                                    </div>
                                </section>

                                {/* Streaks & badges */}
                                <section className="rounded-[24px] bg-[#0e1422] border border-slate-800 p-4">
                                    <p className="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">Streaks</p>
                                    <div className="grid grid-cols-3 gap-2 mt-3">
                                        {[['😴', 'Sleep', gp.streaks.sleep], ['🌙', 'Curfew', gp.streaks.curfew], ['👟', 'Step goal', gp.streaks.steps]].map(([i, l, v]) => (
                                            <div key={l} className="rounded-xl bg-[#060911] border border-slate-800 p-2.5 text-center"><p className="text-lg">{i}</p><p className="text-base font-black text-white">{v}d 🔥</p><p className="text-[9px] uppercase font-black text-slate-500">{l}</p></div>
                                        ))}
                                    </div>
                                    <p className="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 mt-5">Badges</p>
                                    <div className="grid grid-cols-2 gap-2 mt-3">
                                        {badges.map(b => (
                                            <div key={b.id} className={`rounded-xl p-2.5 border ${b.earned ? 'bg-amber-400/10 border-amber-400/40' : 'bg-[#060911] border-slate-800'}`}>
                                                <div className="flex items-center gap-2">
                                                    <span className={`text-xl ${b.earned ? '' : 'grayscale opacity-50'}`}>{b.icon}</span>
                                                    <div className="min-w-0"><p className="text-[11px] font-black text-slate-200 truncate">{b.name}</p><p className="text-[9px] text-slate-500 font-medium truncate">{b.desc}</p></div>
                                                </div>
                                                <div className="mt-2"><Bar pct={(b.have / b.need) * 100} color={b.earned ? '#fbbf24' : '#475569'} /></div>
                                                <p className="text-[9px] font-black text-slate-500 mt-1">{b.earned ? 'Unlocked' : `${b.have}/${b.need}`}</p>
                                            </div>
                                        ))}
                                    </div>
                                </section>

                                <section className="rounded-[24px] bg-[#0e1422] border border-slate-800 p-4 flex gap-3">
                                    <span className="text-xl">🔒</span>
                                    <p className="text-[11px] text-slate-400 font-medium leading-relaxed">Screen time is never shared as minutes. Your squad only sees pass / fail for curfew and Phone Down.</p>
                                </section>
                            </div>
                        </div>
                    )}

                    {/* ---------- Daily / Weekly story viewer ---------- */}
                    {story && (() => {
                        const slides = story.kind === 'daily' ? dailySlides : weeklySlides;
                        const sl = slides[story.idx];
                        return (
                            <div className="absolute inset-0 z-50 flex flex-col animate-fadeIn" style={{ background: sl.bg }}>
                                <div className="flex gap-1 px-3 pt-3">
                                    {slides.map((_, i) => (
                                        <div key={i} className="flex-1 h-1 rounded-full bg-white/25 overflow-hidden">
                                            {i < story.idx ? <div className="h-full w-full bg-white"></div> : i === story.idx ? <div key={`${story.kind}-${i}`} className="h-full bg-white animate-grow"></div> : null}
                                        </div>
                                    ))}
                                </div>
                                <div className="flex items-center justify-between px-4 mt-3">
                                    <div className="flex items-center gap-2">
                                        <span className="w-8 h-8 rounded-full bg-black/30 flex items-center justify-center">⚡</span>
                                        <div><p className="text-xs font-black text-white">{story.kind === 'daily' ? 'Daily Spotlight' : 'Weekly Wrapped'}</p><p className="text-[10px] text-white/70">{groupObj.name}</p></div>
                                    </div>
                                    <button onClick={() => setStory(null)} className="text-white text-3xl leading-none px-2" aria-label="Close">×</button>
                                </div>
                                <div className="relative flex-1 flex flex-col items-center justify-center text-center px-8">
                                    <p className="text-[11px] font-black uppercase tracking-[0.25em] text-white/70">{sl.kicker}</p>
                                    <div className="mt-5 animate-pop" key={`${story.kind}-${story.idx}`}>{sl.hero}</div>
                                    <p className="text-2xl font-black text-white mt-5 leading-tight">{sl.title}</p>
                                    {sl.sub && <p className="text-sm font-bold text-white/80 mt-2">{sl.sub}</p>}
                                    <button className="absolute inset-y-0 left-0 w-1/3" onClick={() => setStory(st => (st.idx > 0 ? { ...st, idx: st.idx - 1 } : st))} aria-label="Previous"></button>
                                    <button className="absolute inset-y-0 right-0 w-2/3" onClick={() => setStory(st => (st.idx < slides.length - 1 ? { ...st, idx: st.idx + 1 } : null))} aria-label="Next"></button>
                                </div>
                                <p className="text-center text-white/60 text-[10px] pb-8">Tap to continue</p>
                            </div>
                        );
                    })()}

                    {snapView && (
                        <div className="absolute inset-0 z-50 flex flex-col animate-fadeIn" style={{ background: snapView.snap.bg }} onClick={() => setSnapView(null)}>
                            <div className="h-1 bg-white/30 m-3 rounded-full overflow-hidden"><div className="h-full bg-white animate-grow"></div></div>
                            <div className="flex items-center gap-2 px-4">
                                <Avatar m={byId[snapView.userId]} size={32} />
                                <span className="text-sm font-black text-white">{byId[snapView.userId].name}</span>
                                <span className="text-xs text-white/70">{snapView.time}</span>
                            </div>
                            <div className="flex-1 flex flex-col items-center justify-center px-8 text-center">
                                <span className="text-8xl">{snapView.snap.emoji}</span>
                                <p className="text-xl font-black text-white mt-6 drop-shadow">{snapView.snap.caption}</p>
                            </div>
                            <p className="text-center text-white/70 text-xs pb-10">Tap to close • view once</p>
                        </div>
                    )}

                    {toast && <div className="absolute bottom-28 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-full bg-white text-black text-xs font-black shadow-2xl animate-pop whitespace-nowrap">{toast}</div>}

                    {/* Bottom Navigation */}
                    <nav className="absolute bottom-3 left-3 right-3 z-30">
                        <div className="relative flex p-1.5 rounded-[26px] bg-[#0b111d]/90 backdrop-blur-xl border border-slate-800/90 shadow-[0_10px_40px_rgba(0,0,0,0.6)]">
                            <div className="absolute top-1.5 bottom-1.5 rounded-[20px] bg-gradient-to-b from-cyan-400/25 to-cyan-400/5 border border-cyan-400/30 shadow-[0_0_24px_rgba(34,211,238,0.18)] transition-all duration-300 ease-out"
                                style={{ left: `calc(6px + ${Math.max(0, TABS.findIndex(x => x[0] === tab))} * (100% - 12px) / ${TABS.length})`, width: `calc((100% - 12px) / ${TABS.length})` }}></div>
                            {TABS.map(([k, label, icon]) => {
                                const active = tab === k;
                                return (
                                    <button key={k} onClick={() => setTab(k)} aria-label={label} aria-current={active ? 'page' : undefined} className="relative flex-1 flex flex-col items-center gap-1 py-2">
                                        <svg className={`w-[22px] h-[22px] transition-all duration-300 ${active ? 'text-cyan-300 -translate-y-0.5' : 'text-slate-500'}`} fill="none" stroke="currentColor" strokeWidth={active ? 2.2 : 1.8} strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">{icon}</svg>
                                        <span className={`text-[10px] font-black tracking-wide transition-colors ${active ? 'text-cyan-200' : 'text-slate-500'}`}>{label}</span>
                                        {k === 'chat' && unread > 0 && <span className="absolute top-1 right-[18%] min-w-[17px] h-[17px] px-1 rounded-full bg-rose-500 text-white text-[9px] font-black flex items-center justify-center ring-2 ring-[#0b111d] animate-pop">{unread}</span>}
                                        {k === 'map' && map.run && <span className="absolute top-1.5 right-[26%] w-2 h-2 rounded-full bg-emerald-400 animate-pulse ring-2 ring-[#0b111d]"></span>}
                                    </button>
                                );
                            })}
                        </div>
                    </nav>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
